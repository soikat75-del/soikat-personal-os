<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOIKAT · LIVE TV</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  min-height:100%;
  background:#030914;
  color:#e9f0ff;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  min-height:100vh;
}

/* =========================
   HEADER
========================= */

.topbar{
  height:58px;
  border-bottom:1px solid rgba(105,140,180,.18);
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  gap:14px;
  padding:0 32px;
  position:sticky;
  top:0;
  z-index:50;
  background:transparent;
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
}

.back{
  color:#a9b6c8;
  text-decoration:none;
  font-size:13px;
  white-space:nowrap;
  justify-self:start;
}

.back:hover{color:#fff}

.logo{
  font-size:15px;
  font-weight:700;
  letter-spacing:.18em;
  white-space:nowrap;
  text-align:center;
  background:linear-gradient(
    110deg,
    #ffffff 10%,
    #9ebcff 45%,
    #ffffff 60%,
    #758fff 80%,
    #ffffff 100%
  );
  background-size:250% auto;
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  animation:
    brandReveal .8s ease forwards,
    brandShine 6s linear infinite,
    brandBreath 4s ease-in-out infinite;
}

.clock{justify-self:end;color:#8fa8d0;font-size:13px}

@keyframes brandReveal{
  from{
    opacity:0;
    transform:translateY(-8px);
    letter-spacing:.28em;
  }
  to{
    opacity:1;
    transform:translateY(0);
    letter-spacing:.18em;
  }
}

@keyframes brandShine{
  0%{background-position:0% center}
  100%{background-position:250% center}
}

@keyframes brandBreath{
  0%,100%{text-shadow:0 0 20px rgba(180,210,255,.05)}
  50%{text-shadow:0 0 30px rgba(180,210,255,.14)}
}

/* =========================
   MAIN
========================= */

.container{
  width:min(1180px,calc(100% - 32px));
  margin:0 auto;
  padding:28px 0 40px;
}

.player-panel{
  width:100%;
  background:#071321;
  border:1px solid #1c3555;
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 20px 70px rgba(0,0,0,.28);
}

.player-wrap{
  width:100%;
  aspect-ratio:16/9;
  background:#02060d;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
}

video{
  width:100%;
  height:100%;
  display:block;
  background:#02060d;
  object-fit:contain;
}

.player-message{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  gap:8px;
  color:#7186a6;
  font-size:13px;
  pointer-events:none;
}

.player-message strong{
  color:#b9c9e3;
  font-size:15px;
}

/* =========================
   CHANNELS
========================= */

.channels-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  margin:28px 0 14px;
}

.channels-title{
  font-size:13px;
  font-weight:700;
  letter-spacing:.16em;
  color:#a9bad4;
}

.now-playing{
  color:#607895;
  font-size:11px;
  white-space:nowrap;
}

.channels{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.channel{
  min-width:0;
  height:76px;
  border:1px solid #1c3555;
  border-radius:12px;
  background:#071321;
  color:#dfe9fa;
  cursor:pointer;
  padding:12px 14px;
  display:flex;
  align-items:center;
  gap:12px;
  text-align:left;
  transition:border-color .18s ease,background .18s ease,transform .18s ease;
}

.channel:hover{
  border-color:#315f94;
  background:#091827;
  transform:translateY(-1px);
}

.channel.active{
  border-color:#398fff;
  box-shadow:0 0 0 1px rgba(57,143,255,.18) inset;
  background:#081a2c;
}

.channel-logo{
  width:46px;
  height:46px;
  flex:0 0 46px;
  border-radius:9px;
  border:1px solid #213e61;
  background:#030914;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  color:#6f88ac;
  font-size:10px;
}

.channel-logo img{
  width:100%;
  height:100%;
  object-fit:contain;
}

.channel-info{
  min-width:0;
}

.channel-name{
  font-size:13px;
  font-weight:700;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.channel-status{
  margin-top:5px;
  color:#6681a7;
  font-size:10px;
}

.live-dot{
  display:inline-block;
  width:6px;
  height:6px;
  border-radius:50%;
  background:#43d7a6;
  margin-right:5px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px){
  .topbar{
    padding:0 16px;
    grid-template-columns:auto 1fr auto;
    gap:10px;
  }

  .logo{
    font-size:13px;
    letter-spacing:.12em;
  }

  .clock{
    font-size:10px;
  }

  .container{
    width:calc(100% - 20px);
    padding-top:18px;
  }

  .player-panel{
    border-radius:12px;
  }

  .channels-head{
    margin-top:20px;
  }

  .channels{
    grid-template-columns:1fr 1fr;
    gap:9px;
  }

  .channel{
    height:68px;
    padding:9px;
    gap:9px;
  }

  .channel-logo{
    width:40px;
    height:40px;
    flex-basis:40px;
  }

  .channel-name{
    font-size:11px;
  }

  .channel-status{
    font-size:9px;
  }
}

@media(max-width:390px){
  .back{font-size:12px}
  .logo{font-size:11px}
  .clock{font-size:9px}

  .channels{
    grid-template-columns:1fr 1fr;
  }

  .channel{
    height:62px;
  }

  .channel-logo{
    width:34px;
    height:34px;
    flex-basis:34px;
  }
}


/* ===== FOOTER — SAME AS 200D PLAN ===== */
footer{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:35px;
  margin-top:38px;
  padding:0 0 20px;
  color:#8292a2;
  font-size:11px;
  letter-spacing:4px;
}

.footer-line{
  width:150px;
  height:1px;
  background:linear-gradient(90deg,transparent,#526b82);
}

.footer-line.right{
  background:linear-gradient(90deg,#526b82,transparent);
}

.heart{
  color:#ff416c;
  font-size:14px;
  display:inline-block;
  animation:heartbeat 1.8s ease-in-out infinite;
  transform-origin:center;
}

@keyframes heartbeat{
  0%,100%{
    transform:scale(1);
  }
  10%{
    transform:scale(1.22);
  }
  20%{
    transform:scale(1);
  }
  30%{
    transform:scale(1.12);
  }
}

.footer-soikat{
  color:#7c8cff;
}

@media(max-width:560px){
  footer{
    gap:12px;
    font-size:8px;
    letter-spacing:2px;
  }

  .footer-line{
    width:55px;
  }
}

/* PUBLIC CHANNEL SEARCH */
.channel-search{display:flex;align-items:center;gap:8px;margin:18px 24px 0;max-width:520px}
.channel-search-wrap{position:relative;flex:1}
.channel-search input{width:100%;height:40px;padding:0 42px 0 14px;border:1px solid #1c3555;border-radius:10px;background:#071321;color:#dfe9fa;outline:none;font-size:12px}
.channel-search input::placeholder{color:#607895}
.channel-search input:focus{border-color:#315f94;box-shadow:0 0 0 3px rgba(49,95,148,.12)}
.channel-search-icon{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:#6f88aa;font-size:14px;pointer-events:none}
.channel-search-clear{height:40px;min-width:40px;border:1px solid #1c3555;border-radius:10px;background:#071321;color:#8ea6c7;cursor:pointer}
.channel-search-clear:hover{border-color:#315f94;color:#fff}
.categories{
  width:calc(100% - 50px);
  margin:0 25px;
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:7px;
  padding:14px 0 12px;
  justify-content:flex-start;
}
@media(max-width:700px){
  .categories{width:calc(100% - 50px);margin-left:25px;margin-right:25px;justify-content:flex-start}
  .channel-search{margin:14px 14px 0}
}
.categories::-webkit-scrollbar{display:none}
.category{
  flex:0 0 auto;
  height:34px;
  padding:0 14px;
  border:1px solid #223f64;
  border-radius:9px;
  background:#071525;
  color:#8299bb;
  font-size:11px;
  font-weight:700;
  letter-spacing:.7px;
  cursor:pointer;
  transition:.18s;
}
.category:hover{
  border-color:#3b8fff;
  color:#fff;
}
.category.active{
  border-color:#3d96ff;
  background:linear-gradient(110deg,#3198ff,#7257ff);
  color:#fff;
  box-shadow:0 0 0 1px #3d96ff55 inset,0 6px 18px rgba(59,117,255,.22);
}


.empty-category{
  grid-column:1/-1;
  min-height:150px;
  border:1px dashed #29476e;
  border-radius:14px;
  background:rgba(7,21,37,.55);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:25px;
}
.empty-category-title{
  color:#a9bde0;
  font-size:13px;
  font-weight:800;
  letter-spacing:1.5px;
}
.empty-category-text{
  margin-top:7px;
  color:#7189ac;
  font-size:11px;
}


.channel-logo img{
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
  border-radius:inherit;
}


/* ================= ADMIN POPUP ================= */
.admin-modal{position:fixed;inset:0;background:rgba(0,0,0,.76);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);display:none;align-items:center;justify-content:center;padding:18px;z-index:9999}
.admin-modal.show{display:flex}
.admin-panel{width:min(1050px,100%);max-height:92vh;overflow:auto;background:#09182a;border:1px solid #29476e;border-radius:18px;box-shadow:0 30px 100px rgba(0,0,0,.65)}
.admin-head{display:flex;align-items:center;justify-content:flex-start;padding:19px 22px;border-bottom:1px solid #203b5d;position:sticky;top:0;background:#09182a;z-index:2}
.admin-head h2{margin:0;font-size:17px;letter-spacing:.7px;flex:0 0 auto}
.admin-save-status{margin-left:0;margin-right:0;font-size:16px;min-width:24px;text-align:center;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center}.admin-save-status.saving{color:#9db8dc;animation:saveSpin .9s linear infinite}.admin-save-status.saved{color:#54d99a}.admin-save-status.error{color:#ff7474}@keyframes saveSpin{to{transform:rotate(360deg)}}
.admin-close{border:0;background:none;color:#9db3d1;font-size:26px;cursor:pointer;margin-left:0;flex:0 0 auto}
.admin-content{padding:20px}
.admin-toolbar{display:flex;align-items:center;justify-content:flex-end;gap:10px;margin:0 12px 0 auto;flex:0 0 auto;flex-wrap:nowrap}
.admin-btn{height:42px;border:1px solid #31547e;border-radius:9px;padding:0 14px;background:#326fe7;color:#fff;font-weight:700;cursor:pointer}
.admin-btn.secondary{background:#0b1b2e}
.admin-btn:disabled{opacity:.55;cursor:wait}
.admin-row{border:1px solid #223f61;border-radius:13px;padding:10px;background:#071525;margin-bottom:10px;overflow:hidden}
.admin-title{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;margin-bottom:8px}
.admin-left{display:flex;align-items:center;gap:8px;min-width:0;flex:1 1 auto}
.admin-right{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.admin-serial{width:36px;min-width:36px;height:42px;display:grid;place-items:center;border:1px solid #29476e;border-radius:9px;background:#0b1b2e;color:#9fc0ff;font-size:12px;font-weight:800}
.admin-name{height:42px;flex:1 1 auto;min-width:150px;border:1px solid #29476e;border-radius:9px;background:#0b1b2e;color:#fff;padding:0 11px;font-size:14px;font-weight:700;outline:0}
.admin-category{height:42px;width:155px;min-width:155px;border:1px solid #29476e;border-radius:9px;background:#0b1b2e;color:#dfeaff;padding:0 11px;font-size:12px;outline:0}
.admin-move{height:42px;width:34px;min-width:34px;border:1px solid #29476e;border-radius:9px;background:#0b1b2e;color:#9fc0ff;font-size:12px;font-weight:800;cursor:pointer;padding:0}
.admin-move:hover:not(:disabled){background:#102845;border-color:#5e8fff;color:#fff}
.admin-move:disabled{opacity:.28;cursor:not-allowed}
.admin-status{width:25px;min-width:25px;text-align:center;font-size:17px;line-height:42px}
.admin-delete{height:42px;width:42px;min-width:42px;border:1px solid #6b3038;border-radius:9px;background:#35151a;color:#ff858d;font-size:18px;font-weight:800;cursor:pointer;padding:0}
.admin-delete:hover{background:#4a1b22;border-color:#a33d48}.admin-status-toggle{width:30px;height:30px;border:0;border-radius:8px;background:transparent;font-size:17px;cursor:pointer;padding:0;display:grid;place-items:center}.admin-status-toggle:hover{background:#102845}
.admin-emoji{width:28px;height:28px;border:0;border-radius:0;background:transparent;color:#9db8dc;font-size:17px;cursor:pointer;padding:0;display:inline-grid;place-items:center}.admin-emoji:hover{color:#fff}.admin-emoji.secondary{background:transparent}.admin-emoji:disabled{opacity:.55;cursor:wait}
.admin-fields{display:grid;grid-template-columns:1fr 2fr 1.2fr;gap:8px;width:100%}
.admin-field-wrap{display:flex;align-items:center;gap:6px;min-width:0}
.admin-field-wrap input{height:42px;flex:1;min-width:0;border:1px solid #29476e;border-radius:9px;background:#0b1b2e;color:#dfeaff;padding:0 11px;font-size:12px;outline:0}
.admin-open-link{height:42px;width:42px;flex:0 0 42px;border:1px solid #31547e;border-radius:9px;background:#0b1b2e;color:#9fc0ff;font-size:17px;cursor:pointer;padding:0;display:inline-grid;place-items:center}
.admin-open-link:hover{background:#102845;border-color:#5e8fff}
.admin-fields input:focus{border-color:#5e8fff}
.admin-fields input:focus,.admin-name:focus,.admin-category:focus{border-color:#5e8fff}
.admin-message{min-height:18px;margin:8px 0 0;font-size:12px}
.admin-message.ok{color:#54d99a}.admin-message.err{color:#ff7474}
.admin-filter-wrap{margin-bottom:12px}
.admin-category-filter{width:180px;height:40px;border:1px solid #29476e;border-radius:9px;background:#0b1b2e;color:#dfeaff;padding:0 11px;font-size:12px;font-weight:700;outline:0}
.admin-category-filter:focus{border-color:#5e8fff}
@media(max-width:600px){.admin-filter-wrap{margin-bottom:8px}.admin-category-filter{width:150px;height:34px;font-size:16px !important}}
 .admin-empty{padding:30px;text-align:center;color:#7189ac}
.footer-soikat{cursor:pointer}

/* ================= CATEGORY MANAGER ================= */
.category-manager-modal,.confirm-modal{
  position:fixed;inset:0;background:rgba(0,0,0,.78);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  display:none;align-items:center;justify-content:center;
  padding:18px;z-index:10001;
}
.category-manager-modal.show,.confirm-modal.show{display:flex}
.category-manager,.confirm-box{
  width:min(500px,100%);background:#09182a;border:1px solid #29476e;
  border-radius:18px;box-shadow:0 30px 100px rgba(0,0,0,.72);overflow:hidden;
}
.category-manager-head,.confirm-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:18px 20px;border-bottom:1px solid #203b5d;
}
.category-manager-head h3,.confirm-head h3{margin:0;font-size:15px;letter-spacing:.5px}
.category-manager-body,.confirm-body{padding:18px 20px}
.category-list{display:flex;flex-direction:column;gap:8px;max-height:330px;overflow:auto}
.category-item{
  min-height:46px;display:flex;align-items:center;justify-content:space-between;
  gap:12px;padding:0 10px 0 14px;border:1px solid #203b5d;
  border-radius:10px;background:#0b1b2e;color:#dfeaff;font-size:13px;font-weight:700;
}
.category-delete{
  width:36px;height:36px;border:1px solid #6b3038;border-radius:8px;
  background:#35151a;color:#ff858d;font-size:16px;cursor:pointer;
}
.category-delete:hover{background:#4a1b22;border-color:#a33d48}
.category-create{
  width:100%;height:42px;margin-top:12px;border:1px dashed #31547e;
  border-radius:10px;background:#0b1b2e;color:#9fc0ff;font-weight:700;cursor:pointer;
}
.category-create:hover{background:#102845;border-color:#5e8fff}
.confirm-icon{
  width:54px;height:54px;margin:0 auto 12px;border-radius:50%;
  display:grid;place-items:center;background:rgba(255,83,99,.10);
  border:1px solid #6b3038;font-size:25px;
}
.confirm-text{text-align:center;color:#a9bde0;font-size:13px;line-height:1.6}
.confirm-text strong{color:#fff}
.confirm-actions{display:flex;gap:8px;justify-content:center;margin-top:18px}
.confirm-actions button{height:40px;min-width:100px;border-radius:9px;cursor:pointer;font-weight:700}
.confirm-cancel{border:1px solid #31547e;background:#0b1b2e;color:#dfeaff}
.confirm-delete{border:1px solid #8d3540;background:#4a1b22;color:#fff}
.category-create-modal .form-input{
  width:100%;height:44px;border:1px solid #29476e;border-radius:9px;
  background:#0b1b2e;color:#fff;padding:0 12px;outline:0;font-size:13px;
}
.category-create-modal .form-input:focus{border-color:#5e8fff}
@media(max-width:700px){
  .category-manager,.confirm-box{width:100%}
}
@media(max-width:700px){
  .admin-title{grid-template-columns:minmax(0,1fr) 130px 42px 30px}
  .admin-fields{grid-template-columns:1fr}
  .admin-content{padding:14px}.admin-head{padding:16px}.admin-toolbar{justify-content:flex-end}
}

/* ===== SESSION TIMER + RIGHT-SIDE REMINDERS ===== */
.clock-stack{justify-self:end;display:flex;flex-direction:column;align-items:flex-end;gap:4px;min-width:0}
.session-timer{
  position:relative;overflow:hidden;isolation:isolate;
  min-width:112px;padding:5px 10px;border:1px solid #e8bd4a;border-radius:9px;
  background:linear-gradient(135deg,rgba(37,31,12,.96),rgba(14,20,31,.98));
  color:#ffe08a;font-size:13px;font-weight:800;font-variant-numeric:tabular-nums;
  letter-spacing:.08em;text-align:center;box-shadow:0 0 14px rgba(232,189,74,.15);
  transition:color .25s,border-color .25s,background .25s,box-shadow .25s;
}
.session-timer::before{content:"";position:absolute;inset:0;z-index:-1;transform:translateX(-120%);background:linear-gradient(105deg,transparent,rgba(255,255,255,.14),transparent);animation:sessionTimerShine 4s ease-in-out infinite}
@keyframes sessionTimerShine{0%,55%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
.session-timer.timer-stage-0{border-color:#e8bd4a;color:#ffe08a;background:linear-gradient(135deg,#29220d,#101827);box-shadow:0 0 13px rgba(232,189,74,.16)}
.session-timer.timer-stage-1{border-color:#ffd34d;color:#ffe08a;background:linear-gradient(135deg,#30270b,#101827);box-shadow:0 0 15px rgba(255,211,77,.22)}
.session-timer.timer-stage-2{border-color:#ffad42;color:#ffc078;background:linear-gradient(135deg,#321d0b,#101827);box-shadow:0 0 16px rgba(255,145,50,.25)}
.session-timer.timer-stage-3{border-color:#ff8a3d;color:#ffad70;background:linear-gradient(135deg,#351b0b,#101827);box-shadow:0 0 17px rgba(255,138,61,.28)}
.session-timer.timer-stage-4{border-color:#ff5964;color:#ff8790;background:linear-gradient(135deg,#351016,#101827);box-shadow:0 0 18px rgba(255,65,85,.3)}
.session-timer.timer-stage-5{border-color:#ff354d;color:#ff6878;background:linear-gradient(135deg,#3a0d17,#101827);box-shadow:0 0 20px rgba(255,53,77,.34);animation:timerRedPulse 1.6s ease-in-out infinite}
@keyframes timerRedPulse{0%,100%{box-shadow:0 0 12px rgba(255,53,77,.22)}50%{box-shadow:0 0 23px rgba(255,53,77,.48)}}
.session-reminder{
  position:fixed;top:72px;right:14px;z-index:9998;width:min(330px,calc(100vw - 28px));
  display:none;align-items:flex-start;gap:10px;padding:12px 12px 12px 14px;
  border:1px solid var(--reminder-color,#e8bd4a);border-left:4px solid var(--reminder-color,#e8bd4a);
  border-radius:12px;background:rgba(7,17,31,.97);color:#edf3ff;
  box-shadow:0 12px 38px rgba(0,0,0,.48);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
}
.session-reminder.show{display:flex;animation:reminderSlideIn .22s ease-out}
@keyframes reminderSlideIn{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:translateX(0)}}
.session-reminder.reminder-yellow{--reminder-color:#ffd34d}
.session-reminder.reminder-orange{--reminder-color:#ff963f}
.session-reminder.reminder-red{--reminder-color:#ff4b60}

let CHANNELS = [];
const channelsEl = document.getElementById("channels");
let selectedCategory = "ALL";
let channelSearchTerm = "";
let CENTRAL_DATA_READY = false;

function apiJsonp(params, timeoutMs=5000, retries=1){
  return new Promise((resolve,reject)=>{
    let attempt=0;
    function tryRequest(){
      attempt++;
      const callbackName="soikatApi_"+Date.now()+"_"+Math.random().toString(36).slice(2);
      const script=document.createElement("script"); let finished=false;
      const timer=setTimeout(()=>finish(new Error("Request timed out")),timeoutMs);
      function cleanup(){clearTimeout(timer);try{delete window[callbackName]}catch(e){}script.remove()}
      function finish(err,data){if(finished)return;finished=true;cleanup();if(!err){resolve(data);return}if(attempt<retries)setTimeout(tryRequest,700*attempt);else reject(err)}
      window[callbackName]=data=>finish(null,data);
      script.onerror=()=>finish(new Error("Failed to reach Google Apps Script"));
      const query=new URLSearchParams({...params,callback:callbackName,t:Date.now()});
      script.src=API_URL+"?"+query.toString(); document.head.appendChild(script);
    }
    tryRequest();
  });
}

function saveLocalCentralData(){
  try{localStorage.setItem("SOIKAT_LIVE_TV_DATA",JSON.stringify({channels:CHANNELS,categories:CATEGORIES,savedAt:Date.now()}))}catch(e){}
}

function loadLocalCentralData(){
  try{
    const raw=localStorage.getItem("SOIKAT_LIVE_TV_DATA"); if(!raw)return false;
    const d=JSON.parse(raw); if(!d||!Array.isArray(d.channels)||!Array.isArray(d.categories))return false;
    CHANNELS=d.channels; CATEGORIES=d.categories; CENTRAL_DATA_READY=true;
    renderPublicCategories(); renderChannels(); return true;
  }catch(e){return false}
}

const FAVORITES_KEY = "SOIKAT_LIVE_TV_FAVORITES";
const SELECTED_CATEGORY_KEY = "SOIKAT_LIVE_TV_SELECTED_CATEGORY";
let favoriteChannels = new Set();
let currentlyPlayingKey = "";

function channelFavoriteKey(channel){
  return String(channel?.name || "") + "||" + String(channel?.url || "");
}
function loadFavorites(){
  try{
    const saved=JSON.parse(localStorage.getItem(FAVORITES_KEY)||"[]");
    favoriteChannels=new Set(Array.isArray(saved)?saved:[]);
  }catch(e){favoriteChannels=new Set()}
}
function saveFavorites(){
  try{localStorage.setItem(FAVORITES_KEY,JSON.stringify([...favoriteChannels]))}catch(e){}
}
function renderPublicCategories(){
  const wrap = document.getElementById("categories");
  if(!wrap) return;
  const active = selectedCategory || "ALL";
  const allCount = CHANNELS.length;
  const favoriteCount = CHANNELS.filter(ch=>favoriteChannels.has(channelFavoriteKey(ch))).length;
  wrap.innerHTML = `<button class="category ${active==="ALL"?"active":""}" data-category="ALL">ALL${active==="ALL" ? ` (${allCount})` : ""}</button>` +
    (favoriteCount ? `<button class="category ${active==="FAVORITES"?"active":""}" data-category="FAVORITES">⭐ FAVORITES${active==="FAVORITES" ? ` (${favoriteCount})` : ""}</button>` : "") +
    CATEGORIES.map(cat => {
      const name = String(cat).toUpperCase();
      const count = CHANNELS.filter(ch => String(ch.category || "").toUpperCase() === name).length;
      return `<button class="category ${active===name?"active":""}" data-category="${escapeAttr(name)}">${escapeHtml(name)}${active===name ? ` (${count})` : ""}</button>`;
    }).join("");
  wrap.querySelectorAll(".category").forEach(button => {
    button.addEventListener("click", function(){
      selectedCategory = String(this.dataset.category || "ALL").toUpperCase();
      try{sessionStorage.setItem(SELECTED_CATEGORY_KEY,selectedCategory)}catch(e){}
      renderPublicCategories();
      renderChannels();
    });
  });
}

async function loadCentralData(){
  const wrap = document.getElementById("categories");

  if(!API_URL || API_URL.includes("PASTE_YOUR_")){
    if(wrap) wrap.innerHTML = "";
    channelsEl.innerHTML = `
      <div class="empty-category">
        <div class="empty-category-title">DATA SOURCE NOT CONFIGURED</div>
        <div class="empty-category-text">Central Live TV data is not configured.</div>
      </div>`;
    return;
  }

  const cached=loadLocalCentralData();

  try{
    const data = await apiJsonp({action:"get"});
    if(!data || !data.ok) throw new Error((data&&data.error)||"Central data unavailable");
    // Do not replace active admin data if the user has already started editing.
    // The admin form is the source of truth once editing has begun.
    if(adminEditVersion===0){
      CATEGORIES=Array.isArray(data.categories)?data.categories:[];
      CHANNELS=Array.isArray(data.channels)?data.channels:[];
      CENTRAL_DATA_READY=true;
      saveLocalCentralData();
      renderPublicCategories(); renderChannels();
    }else{
      CENTRAL_DATA_READY=true;
    }
  }catch(error){
    console.error("Central Live TV data unavailable:", error);
    CENTRAL_DATA_READY = cached;

    if(cached){
      renderPublicCategories();
      renderChannels();
      return;
    }

    if(wrap){
      wrap.innerHTML = `<div class="category-loading">Unable to load categories</div>`;
    }
    channelsEl.innerHTML = `
      <div class="empty-category">
        <div class="empty-category-title">UNABLE TO LOAD DATA</div>
        <div class="empty-category-text">Please refresh and try again.</div>
      </div>`;
  }
}

function renderChannels(){
  const term = channelSearchTerm.trim().toLowerCase();
  const list = CHANNELS.filter(channel => {
    const categoryMatch = selectedCategory === "ALL" ||
      (selectedCategory === "FAVORITES" ? favoriteChannels.has(channelFavoriteKey(channel)) :
      String(channel.category || "").toUpperCase() === selectedCategory);
    const searchMatch = !term ||
      String(channel.name || "").toLowerCase().includes(term);
    return categoryMatch && searchMatch;
  });

  if(!list.length){
    channelsEl.innerHTML = `
      <div class="empty-category">
        <div class="empty-category-title">NO CHANNELS</div>
        <div class="empty-category-text">${term ? `No channels found for “${escapeHtml(channelSearchTerm)}”.` : `No channels are available in ${selectedCategory} yet.`}</div>
      </div>`;
    return;
  }

  channelsEl.innerHTML = list.map(channel => {
    const key=channelFavoriteKey(channel);
    const playing=currentlyPlayingKey===key;
    const favorite=favoriteChannels.has(key);
    return `
    <a class="channel-card ${playing?"currently-playing":""}" data-channel-key="${escapeAttr(key)}" href="${escapeAttr(channel.url)}" target="_blank" rel="noopener noreferrer">
      <div class="channel-logo">
        ${channel.logo
          ? `<img src="${escapeAttr(channel.logo)}" alt="" referrerpolicy="no-referrer">`
          : `<span>${String(channel.name || "?").charAt(0).toUpperCase()}</span>`}
      </div>
      <div class="channel-name">${escapeHtml(channel.name)}${playing?`<span class="playing-label">CURRENTLY PLAYING</span>`:""}</div>

function deleteCategory(category){
  const target=String(category).trim().toUpperCase();
  const previous=CATEGORIES.slice();

  // Instant local delete — UI does not wait for Apps Script.
  CATEGORIES=CATEGORIES.filter(c=>String(c).toUpperCase()!==target);
  renderCategoryManager();
  renderAdmin();
  renderPublicCategories();
  closeConfirm();
  setAdminSaveStatus("🔄");

  // Save in the background. Streams are NOT deleted or changed.
  apiJsonp({action:"deleteCategory",category:target},5000,1).then(data=>{
    if(!data || !data.ok) throw new Error((data&&data.error)||"Category deletion failed");
    CATEGORIES=Array.isArray(data.categories)?data.categories:CATEGORIES;
    saveLocalCentralData();
    renderCategoryManager();
    renderPublicCategories();
    setAdminSaveStatus("✅");
  }).catch(e=>{
    CATEGORIES=previous;
    renderCategoryManager();
    renderAdmin();
    renderPublicCategories();
    setAdminSaveStatus("❌","error");
  });
}

/* Touch + mouse drag-to-reorder. Existing move buttons remain unchanged. */
(function enableAdminRowDragging(){
  let dragState=null;
  document.addEventListener("pointerdown",event=>{
    const handle=event.target.closest(".admin-serial");
    if(!handle || !handle.closest("#adminRows")) return;
    if(event.pointerType==="mouse" && event.button!==0) return;
    const row=handle.closest(".admin-row");
    if(!row) return;
    dragState={source:Number(row.dataset.row),startX:event.clientX,startY:event.clientY,active:false,target:Number(row.dataset.row)};
  });
  document.addEventListener("pointermove",event=>{
    if(!dragState) return;
    if(!dragState.active){
      if(Math.hypot(event.clientX-dragState.startX,event.clientY-dragState.startY)<7) return;
      dragState.active=true;
    }
    event.preventDefault();
    document.querySelectorAll("#adminRows .admin-row.drag-target").forEach(el=>el.classList.remove("drag-target"));
    const under=document.elementFromPoint(event.clientX,event.clientY);
    const row=under?.closest("#adminRows .admin-row");
    if(row){
      dragState.target=Number(row.dataset.row);
      row.classList.add("drag-target");
    }
  },{passive:false});
  document.addEventListener("pointerup",()=>{
    if(!dragState) return;
    const state=dragState; dragState=null;
    document.querySelectorAll("#adminRows .admin-row.drag-target").forEach(el=>el.classList.remove("drag-target"));
    if(!state.active || !Number.isInteger(state.source) || !Number.isInteger(state.target) ||
       state.source===state.target || state.source<0 || state.target<0 ||
       state.source>=CHANNELS.length || state.target>=CHANNELS.length) return;
    const moved=CHANNELS.splice(state.source,1)[0];
    CHANNELS.splice(state.target,0,moved);
    renderAdmin();
    renderChannels();
    setAdminMessage(`Channel moved to serial ${state.target+1}. Saving automatically…`,"ok");
    scheduleAutoSave();
  });
  document.addEventListener("pointercancel",()=>{dragState=null;document.querySelectorAll("#adminRows .admin-row.drag-target").forEach(el=>el.classList.remove("drag-target"))});
})();

let autoSaveTimer=null;
let autoSaveBusy=false;
let autoSaveRetryTimer=null;
let autoSaveRetryDelay=3000;
let autoSaveFailed=false;
let adminEditVersion=0;
let draftSaveTimer=null;

function saveDraftLocally(){
  try{
    const next=collectAdminChannels();
    localStorage.setItem("SOIKAT_LIVE_TV_DRAFT",JSON.stringify({
      channels:next,
      categories:CATEGORIES,
      savedAt:Date.now()
    }));
  }catch(e){}
}

function scheduleDraftSave(){
  clearTimeout(draftSaveTimer);
  draftSaveTimer=setTimeout(()=>{
    draftSaveTimer=null;
    saveDraftLocally();
  },150);
}

function scheduleFailedSaveRetry(){
  clearTimeout(autoSaveRetryTimer);
  autoSaveRetryTimer=setTimeout(()=>{
    autoSaveRetryTimer=null;
    autoSaveNow();
  },autoSaveRetryDelay);
}

async function saveCentralPost(payload){
  if(!API_URL || API_URL.includes("PASTE_YOUR_")){
    throw new Error("API URL not configured");
  }

  await fetch(API_URL,{
    method:"POST",
    mode:"no-cors",
    headers:{"Content-Type":"text/plain;charset=UTF-8"},
    body:JSON.stringify(payload),
    keepalive:true
  });
}

async function autoSaveNow(){
  if(autoSaveBusy){
    return;
  }

  autoSaveBusy=true;
  setAdminSaveStatus("🔄");

  // CHANNELS is kept in sync on every admin input, so the save snapshot
  // never has to rebuild data from DOM elements that may be replaced.
  const versionAtStart=adminEditVersion;
  const next=CHANNELS.map(channel=>({...channel}));

  try{
    await saveCentralPost({
      action:"save",
      channels:next,
      categories:CATEGORIES
    });

    /*
      If the user typed anything while the request was running, this save
      is already stale. NEVER replace the current data with that old snapshot
      and NEVER clear the local draft. The newest form values win.
    */
    if(versionAtStart!==adminEditVersion){
      autoSaveBusy=false;
      setAdminSaveStatus("🔄");
      clearTimeout(autoSaveTimer);
      autoSaveTimer=setTimeout(autoSaveNow,100);
      return;
    }

    CHANNELS=next;
    saveLocalCentralData();

    try{
      localStorage.removeItem("SOIKAT_LIVE_TV_DRAFT");
    }catch(e){}

    renderChannels();
    renderPublicCategories();

    autoSaveFailed=false;
    autoSaveRetryDelay=3000;
    clearTimeout(autoSaveRetryTimer);
    autoSaveRetryTimer=null;
    setAdminSaveStatus("✅");

  }catch(e){
    console.warn("Auto save failed. Will retry automatically:",e);

    // Keep the current form values in a local draft. Nothing in the form is
    // re-rendered or cleared when the central save is slow/fails.
    saveDraftLocally();
    autoSaveFailed=true;
    setAdminSaveStatus("❌","error");
    scheduleFailedSaveRetry();

  }finally{
    if(autoSaveBusy) autoSaveBusy=false;
  }
}

function scheduleAutoSave(){
  adminEditVersion++;
  clearTimeout(autoSaveTimer);
  setAdminSaveStatus("🔄");
  scheduleDraftSave();

  // Do not cancel a save that is already in progress. It will detect that
  // the form changed and immediately save the newest version afterwards.
  clearTimeout(autoSaveRetryTimer);
  autoSaveRetryTimer=null;
  autoSaveFailed=false;

  // Wait until typing pauses before starting the network request.
  autoSaveTimer=setTimeout(autoSaveNow,1200);
}

  scheduleAutoSave();
});

    {at:45*60*1000,stage:2,color:"reminder-orange",text:"🟠 ৪৫ মিনিট: 😐 সময়ও একটা সম্পদ।"},
    {at:60*60*1000,stage:3,color:"reminder-orange",text:"🟠 ১ ঘন্টা: 😠 এবার থামো, উদ্দেশ্যটা মনে করো।"},
    {at:90*60*1000,stage:4,color:"reminder-red",text:"🔴 ১ ঘন্টা ৩০ মিনিট: 😡 যথেষ্ট হয়েছে—এবার কাজে ফেরো!"},
    {at:120*60*1000,stage:5,color:"reminder-red",text:"🔴 ২ ঘন্টা: 😡 যথেষ্ট হয়েছে—এবার কাজে ফেরো!"}
  ];
  let activeNotice=-1;
  let elapsedMs=0;

  function formatDuration(ms){
    const total=Math.floor(ms/1000);
    const h=Math.floor(total/3600);
    const m=Math.floor((total%3600)/60);
    const sec=total%60;
    return [h,m,sec].map(n=>String(n).padStart(2,"0")).join(":");
  }
  function showNotice(index){
    const notice=notices[index];
    if(!notice)return;
    activeNotice=index;
    reminderText.textContent=notice.text;
    reminder.className="session-reminder show "+notice.color;
  }
  reminderOk.addEventListener("click",()=>{
    reminder.classList.remove("show");
    activeNotice=-1;
  });

  // Back means ending this session: reset before navigating away.
  const backButton=document.querySelector(".back");
  if(backButton){
    backButton.addEventListener("click",function(e){
      e.preventDefault();
      startedAt=Date.now();
      elapsedMs=0;
      activeNotice=-1;
      try{
        sessionStorage.setItem(START_KEY,String(startedAt));
        sessionStorage.setItem(NOTICE_KEY,"-1");
      }catch(err){}
      timerEl.textContent="00:00:00";
      timerEl.className="session-timer timer-stage-0";
      reminder.classList.remove("show");
      history.back();
    });
  }

  function tick(){
    elapsedMs=Math.max(0,Date.now()-startedAt);
    timerEl.textContent=formatDuration(elapsedMs);
    let stage=0;
    for(let i=0;i<notices.length;i++){
      if(elapsedMs>=notices[i].at)stage=notices[i].stage;
    }
    // After two hours, repeat the red reminder every 30 minutes.
    if(elapsedMs>=120*60*1000){
      stage=5;
      const repeatIndex=Math.floor((elapsedMs-120*60*1000)/(30*60*1000));
      const currentNoticeIndex=5+repeatIndex;
      let lastNotice=-1;
      try{lastNotice=Number(sessionStorage.getItem(NOTICE_KEY)||"-1")}catch(e){}
      if(currentNoticeIndex>lastNotice){
        showNotice(5);
        try{sessionStorage.setItem(NOTICE_KEY,String(currentNoticeIndex))}catch(e){}
      }
    }else{
      const dueIndex=notices.reduce((found,item,index)=>elapsedMs>=item.at?index:found,-1);
      let lastNotice=-1;
      try{lastNotice=Number(sessionStorage.getItem(NOTICE_KEY)||"-1")}catch(e){}
      if(dueIndex>=0 && dueIndex>lastNotice){
        showNotice(dueIndex);
        try{sessionStorage.setItem(NOTICE_KEY,String(dueIndex))}catch(e){}
      }
    }
    timerEl.className="session-timer timer-stage-"+stage;
  }
  tick();
  setInterval(tick,1000);
})();


</script>
