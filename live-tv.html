<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOIKAT · LIVE TV</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  min-height:100%;
  background:#030914;
  color:#e9f0ff;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  min-height:100vh;
}

/* =========================
   HEADER
========================= */

.topbar{
  height:58px;
  border-bottom:1px solid rgba(105,140,180,.18);
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  gap:14px;
  padding:0 32px;
  position:sticky;
  top:0;
  z-index:50;
  background:transparent;
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
}

.back{
  color:#a9b6c8;
  text-decoration:none;
  font-size:13px;
  white-space:nowrap;
  justify-self:start;
}

.back:hover{color:#fff}

.logo{
  font-size:15px;
  font-weight:700;
  letter-spacing:.18em;
  white-space:nowrap;
  text-align:center;
  background:linear-gradient(
    110deg,
    #ffffff 10%,
    #9ebcff 45%,
    #ffffff 60%,
    #758fff 80%,
    #ffffff 100%
  );
  background-size:250% auto;
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  animation:
    brandReveal .8s ease forwards,
    brandShine 6s linear infinite,
    brandBreath 4s ease-in-out infinite;
}

.clock{justify-self:end;color:#8fa8d0;font-size:13px}

@keyframes brandReveal{
  from{
    opacity:0;
    transform:translateY(-8px);
    letter-spacing:.28em;
  }
  to{
    opacity:1;
    transform:translateY(0);
    letter-spacing:.18em;
  }
}

@keyframes brandShine{
  0%{background-position:0% center}
  100%{background-position:250% center}
}

@keyframes brandBreath{
  0%,100%{text-shadow:0 0 20px rgba(180,210,255,.05)}
  50%{text-shadow:0 0 30px rgba(180,210,255,.14)}
}

/* =========================
   MAIN
========================= */

.container{
  width:min(1180px,calc(100% - 32px));
  margin:0 auto;
  padding:28px 0 40px;
}

.player-panel{
  width:100%;
  background:#071321;
  border:1px solid #1c3555;
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 20px 70px rgba(0,0,0,.28);
}

.player-wrap{
  width:100%;
  aspect-ratio:16/9;
  background:#02060d;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
}

video{
  width:100%;
  height:100%;
  display:block;
  background:#02060d;
  object-fit:contain;
}

.player-message{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  gap:8px;
  color:#7186a6;
  font-size:13px;
  pointer-events:none;
}

.player-message strong{
  color:#b9c9e3;
  font-size:15px;
}

/* =========================
   CHANNELS
========================= */

.channels-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  margin:28px 0 14px;
}

.channels-title{
  font-size:13px;
  font-weight:700;
  letter-spacing:.16em;
  color:#a9bad4;
}

.now-playing{
  color:#607895;
  font-size:11px;
  white-space:nowrap;
}

.channels{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.channel{
  min-width:0;
  height:76px;
  border:1px solid #1c3555;
  border-radius:12px;
  background:#071321;
  color:#dfe9fa;
  cursor:pointer;
  padding:12px 14px;
  display:flex;
  align-items:center;
  gap:12px;
  text-align:left;
  transition:border-color .18s ease,background .18s ease,transform .18s ease;
}

.channel:hover{
  border-color:#315f94;
  background:#091827;
  transform:translateY(-1px);
}

.channel.active{
  border-color:#398fff;
  box-shadow:0 0 0 1px rgba(57,143,255,.18) inset;
  background:#081a2c;
}

.channel-logo{
  width:46px;
  height:46px;
  flex:0 0 46px;
  border-radius:9px;
  border:1px solid #213e61;
  background:#030914;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  color:#6f88ac;
  font-size:10px;
}

.channel-logo img{
  width:100%;
  height:100%;
  object-fit:contain;
}

.channel-info{
  min-width:0;
}

.channel-name{
  font-size:13px;
  font-weight:700;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.channel-status{
  margin-top:5px;
  color:#6681a7;
  font-size:10px;
}

.live-dot{
  display:inline-block;
  width:6px;
  height:6px;
  border-radius:50%;
  background:#43d7a6;
  margin-right:5px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px){
  .topbar{
    padding:0 16px;
    grid-template-columns:auto 1fr auto;
    gap:10px;
  }

  .logo{
    font-size:13px;
    letter-spacing:.12em;
  }

  .clock{
    font-size:10px;
  }

  .container{
    width:calc(100% - 20px);
    padding-top:18px;
  }

  .player-panel{
    border-radius:12px;
  }

  .channels-head{
    margin-top:20px;
  }

  .channels{
    grid-template-columns:1fr 1fr;
    gap:9px;
  }

  .channel{
    height:68px;
    padding:9px;
    gap:9px;
  }

  .channel-logo{
    width:40px;
    height:40px;
    flex-basis:40px;
  }

  .channel-name{
    font-size:11px;
  }

  .channel-status{
    font-size:9px;
  }
}

@media(max-width:390px){
  .back{font-size:12px}
  .logo{font-size:11px}
  .clock{font-size:9px}

  .channels{
    grid-template-columns:1fr 1fr;
  }

  .channel{
    height:62px;
  }

  .channel-logo{
    width:34px;
    height:34px;
    flex-basis:34px;
  }
}


/* ===== FOOTER — SAME AS 200D PLAN ===== */
footer{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:35px;
  margin-top:38px;
  padding:0 0 20px;
  color:#8292a2;
  font-size:11px;
  letter-spacing:4px;
}

.footer-line{
  width:150px;
  height:1px;
  background:linear-gradient(90deg,transparent,#526b82);
}

.footer-line.right{
  background:linear-gradient(90deg,#526b82,transparent);
}

.heart{
  color:#ff416c;
  font-size:14px;
  display:inline-block;
  animation:heartbeat 1.8s ease-in-out infinite;
  transform-origin:center;
}

@keyframes heartbeat{
  0%,100%{
    transform:scale(1);
  }
  10%{
    transform:scale(1.22);
  }
  20%{
    transform:scale(1);
  }
  30%{
    transform:scale(1.12);
  }
}

.footer-soikat{
  color:#7c8cff;
}

@media(max-width:560px){
  footer{
    gap:12px;
    font-size:8px;
    letter-spacing:2px;
  }

  .footer-line{
    width:55px;
  }
}

/* PUBLIC CHANNEL SEARCH */
.channel-search{display:flex;align-items:center;gap:8px;margin:18px 24px 0;max-width:520px}
.channel-search-wrap{position:relative;flex:1}
.channel-search input{width:100%;height:40px;padding:0 42px 0 14px;border:1px solid #1c3555;border-radius:10px;background:#071321;color:#dfe9fa;outline:none;font-size:12px}
.channel-search input::placeholder{color:#607895}
.channel-search input:focus{border-color:#315f94;box-shadow:0 0 0 3px rgba(49,95,148,.12)}
.channel-search-icon{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:#6f88aa;font-size:14px;pointer-events:none}
.channel-search-clear{height:40px;min-width:40px;border:1px solid #1c3555;border-radius:10px;background:#071321;color:#8ea6c7;cursor:pointer}
.channel-search-clear:hover{border-color:#315f94;color:#fff}
@media(max-width:700px){.channel-search{margin:14px 14px 0}}

.categories{
  display:flex;
  align-items:center;
  gap:7px;
  padding:14px 0 12px;
  overflow-x:auto;
  scrollbar-width:none;
}
.categories::-webkit-scrollbar{display:none}
.category{
  flex:0 0 auto;
  height:34px;
  padding:0 14px;
  border:1px solid #223f64;
  border-radius:9px;
  background:#071525;
  color:#8299bb;
  font-size:11px;
  font-weight:700;
  letter-spacing:.7px;
  cursor:pointer;
  transition:.18s;
}
.category:hover{
  border-color:#3b8fff;
  color:#fff;
}
.category.active{
  border-color:#3d96ff;
  background:linear-gradient(110deg,#3198ff,#7257ff);
  color:#fff;
  box-shadow:0 0 0 1px #3d96ff55 inset,0 6px 18px rgba(59,117,255,.22);
}


.empty-category{
  grid-column:1/-1;
  min-height:150px;
  border:1px dashed #29476e;
  border-radius:14px;
  background:rgba(7,21,37,.55);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:25px;
}
.empty-category-title{
  color:#a9bde0;
  font-size:13px;
  font-weight:800;
  letter-spacing:1.5px;
}
.empty-category-text{
  margin-top:7px;
  color:#7189ac;
  font-size:11px;
}


.channel-logo img{
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
  border-radius:inherit;
}


/* ================= ADMIN POPUP ================= */
.admin-modal{position:fixed;inset:0;background:rgba(0,0,0,.76);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);display:none;align-items:center;justify-content:center;padding:18px;z-index:9999}
.admin-modal.show{display:flex}
.admin-panel{width:min(1050px,100%);max-height:92vh;overflow:auto;background:#09182a;border:1px solid #29476e;border-radius:18px;box-shadow:0 30px 100px rgba(0,0,0,.65)}
.admin-head{display:flex;align-items:center;justify-content:flex-start;padding:19px 22px;border-bottom:1px solid #203b5d;position:sticky;top:0;background:#09182a;z-index:2}
.admin-head h2{margin:0;font-size:17px;letter-spacing:.7px;flex:0 0 auto}
.admin-save-status{margin-left:0;margin-right:0;font-size:16px;min-width:24px;text-align:center;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center}.admin-save-status.saving{color:#9db8dc;animation:saveSpin .9s linear infinite}.admin-save-status.saved{color:#54d99a}.admin-save-status.error{color:#ff7474}@keyframes saveSpin{to{transform:rotate(360deg)}}
.admin-close{border:0;background:none;color:#9db3d1;font-size:26px;cursor:pointer;margin-left:0;flex:0 0 auto}
.admin-content{padding:20px}
.admin-toolbar{display:flex;align-items:center;justify-content:flex-end;gap:10px;margin:0 12px 0 auto;flex:0 0 auto;flex-wrap:nowrap}
.admin-btn{height:42px;border:1px solid #31547e;border-radius:9px;padding:0 14px;background:#326fe7;color:#fff;font-weight:700;cursor:pointer}
.admin-btn.secondary{background:#0b1b2e}
.admin-btn:disabled{opacity:.55;cursor:wait}
.admin-row{border:1px solid #223f61;border-radius:13px;padding:10px;background:#071525;margin-bottom:10px;overflow:hidden}
.admin-title{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;margin-bottom:8px}
.admin-left{display:flex;align-items:center;gap:8px;min-width:0;flex:1 1 auto}
.admin-right{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.admin-serial{width:36px;min-width:36px;height:42px;display:grid;place-items:center;border:1px solid #29476e;border-radius:9px;background:#0b1b2e;color:#9fc0ff;font-size:12px;font-weight:800}
.admin-name{height:42px;flex:1 1 auto;min-width:150px;border:1px solid #29476e;border-radius:9px;background:#0b1b2e;color:#fff;padding:0 11px;font-size:14px;font-weight:700;outline:0}
.admin-category{height:42px;width:155px;min-width:155px;border:1px solid #29476e;border-radius:9px;background:#0b1b2e;color:#dfeaff;padding:0 11px;font-size:12px;outline:0}
.admin-move{height:42px;width:34px;min-width:34px;border:1px solid #29476e;border-radius:9px;background:#0b1b2e;color:#9fc0ff;font-size:12px;font-weight:800;cursor:pointer;padding:0}
.admin-move:hover:not(:disabled){background:#102845;border-color:#5e8fff;color:#fff}
.admin-move:disabled{opacity:.28;cursor:not-allowed}
.admin-status{width:25px;min-width:25px;text-align:center;font-size:17px;line-height:42px}
.admin-delete{height:42px;width:42px;min-width:42px;border:1px solid #6b3038;border-radius:9px;background:#35151a;color:#ff858d;font-size:18px;font-weight:800;cursor:pointer;padding:0}
.admin-delete:hover{background:#4a1b22;border-color:#a33d48}
.admin-emoji{width:28px;height:28px;border:0;border-radius:0;background:transparent;color:#9db8dc;font-size:17px;cursor:pointer;padding:0;display:inline-grid;place-items:center}.admin-emoji:hover{color:#fff}.admin-emoji.secondary{background:transparent}.admin-emoji:disabled{opacity:.55;cursor:wait}
.admin-category option:last-child{color:#78a8ff;font-weight:700}
.admin-fields{display:grid;grid-template-columns:1fr 2fr 1.2fr;gap:8px;width:100%}
.admin-field-wrap{display:flex;align-items:center;gap:6px;min-width:0}
.admin-field-wrap input{height:42px;flex:1;min-width:0;border:1px solid #29476e;border-radius:9px;background:#0b1b2e;color:#dfeaff;padding:0 11px;font-size:12px;outline:0}
.admin-open-link{height:42px;width:42px;flex:0 0 42px;border:1px solid #31547e;border-radius:9px;background:#0b1b2e;color:#9fc0ff;font-size:17px;cursor:pointer;padding:0;display:inline-grid;place-items:center}
.admin-open-link:hover{background:#102845;border-color:#5e8fff}
.admin-fields input:focus{border-color:#5e8fff}
.admin-fields input:focus,.admin-name:focus,.admin-category:focus{border-color:#5e8fff}
.admin-message{min-height:18px;margin:8px 0 0;font-size:12px}
.admin-message.ok{color:#54d99a}.admin-message.err{color:#ff7474}
 .admin-empty{padding:30px;text-align:center;color:#7189ac}
.footer-soikat{cursor:pointer}

/* ================= CATEGORY MANAGER ================= */
.category-manager-modal,.confirm-modal{
  position:fixed;inset:0;background:rgba(0,0,0,.78);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  display:none;align-items:center;justify-content:center;
  padding:18px;z-index:10001;
}
.category-manager-modal.show,.confirm-modal.show{display:flex}
.category-manager,.confirm-box{
  width:min(500px,100%);background:#09182a;border:1px solid #29476e;
  border-radius:18px;box-shadow:0 30px 100px rgba(0,0,0,.72);overflow:hidden;
}
.category-manager-head,.confirm-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:18px 20px;border-bottom:1px solid #203b5d;
}
.category-manager-head h3,.confirm-head h3{margin:0;font-size:15px;letter-spacing:.5px}
.category-manager-body,.confirm-body{padding:18px 20px}
.category-list{display:flex;flex-direction:column;gap:8px;max-height:330px;overflow:auto}
.category-item{
  min-height:46px;display:flex;align-items:center;justify-content:space-between;
  gap:12px;padding:0 10px 0 14px;border:1px solid #203b5d;
  border-radius:10px;background:#0b1b2e;color:#dfeaff;font-size:13px;font-weight:700;
}
.category-delete{
  width:36px;height:36px;border:1px solid #6b3038;border-radius:8px;
  background:#35151a;color:#ff858d;font-size:16px;cursor:pointer;
}
.category-delete:hover{background:#4a1b22;border-color:#a33d48}
.category-create{
  width:100%;height:42px;margin-top:12px;border:1px dashed #31547e;
  border-radius:10px;background:#0b1b2e;color:#9fc0ff;font-weight:700;cursor:pointer;
}
.category-create:hover{background:#102845;border-color:#5e8fff}
.confirm-icon{
  width:54px;height:54px;margin:0 auto 12px;border-radius:50%;
  display:grid;place-items:center;background:rgba(255,83,99,.10);
  border:1px solid #6b3038;font-size:25px;
}
.confirm-text{text-align:center;color:#a9bde0;font-size:13px;line-height:1.6}
.confirm-text strong{color:#fff}
.confirm-actions{display:flex;gap:8px;justify-content:center;margin-top:18px}
.confirm-actions button{height:40px;min-width:100px;border-radius:9px;cursor:pointer;font-weight:700}
.confirm-cancel{border:1px solid #31547e;background:#0b1b2e;color:#dfeaff}
.confirm-delete{border:1px solid #8d3540;background:#4a1b22;color:#fff}
.category-create-modal .form-input{
  width:100%;height:44px;border:1px solid #29476e;border-radius:9px;
  background:#0b1b2e;color:#fff;padding:0 12px;outline:0;font-size:13px;
}
.category-create-modal .form-input:focus{border-color:#5e8fff}
@media(max-width:700px){
  .category-manager,.confirm-box{width:100%}
}
@media(max-width:700px){
  .admin-title{grid-template-columns:minmax(0,1fr) 130px 42px 30px}
  .admin-fields{grid-template-columns:1fr}
  .admin-content{padding:14px}.admin-head{padding:16px}.admin-toolbar{justify-content:flex-end}
}
</style>

<style>
.category-loading{
  color:#7189ac;
  font-size:11px;
  padding:0 6px;
  white-space:nowrap;
}
.admin-serial{
  width:26px;

  height:30px;
  display:grid;

  border:1px solid #223f64;

<style>
#debugInfo{
  margin-top:10px;
  padding:9px 11px;
  border:1px solid #172b45;
  border-radius:9px;
  background:#050e19;
  color:#58708f;
  font-size:10px;
  line-height:1.5;
  word-break:break-word;
}
#debugInfo b{color:#7f9abb}
</style>

<style>
.channels-section{padding:22px 24px 40px}
.section-title{font-size:13px;font-weight:800;letter-spacing:.18em;margin-bottom:14px}
.channels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.channel-card{
  text-decoration:none;color:inherit;
  min-height:76px;padding:14px 16px;
  border:1px solid rgba(255,255,255,.08);
  border-radius:12px;background:rgba(255,255,255,.035);
  display:flex;align-items:center;gap:12px;
  transition:transform .18s ease,border-color .18s ease,background .18s ease
}
.channel-card:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.18);background:rgba(255,255,255,.06)}
.channel-logo{width:42px;height:42px;border-radius:9px;display:grid;place-items:center;flex:0 0 42px;background:rgba(255,255,255,.08);overflow:hidden}
.channel-logo img{width:100%;height:100%;object-fit:contain}
.channel-logo span{font-weight:800;font-size:16px}
.channel-name{font-size:14px;font-weight:700;flex:1}
.channel-open{font-size:10px;letter-spacing:.12em;opacity:.55}
@media(max-width:700px){.channels{grid-template-columns:repeat(2,minmax(0,1fr))}.channels-section{padding:18px 14px 30px}}
@media(max-width:430px){.channels{grid-template-columns:1fr}}
</style>
</head>

<body>

<header class="topbar">
  <a class="back" href="javascript:history.back()">← Back</a>
  <div class="logo">SOIKAT · LIVE TV</div>
  <div class="clock" id="clock">07 Oct 2026, 12:44 pm</div>
</header>


<div class="categories" id="categories"></div>

<div class="channel-search">
  <div class="channel-search-wrap">
    <input id="channelSearch" type="search" placeholder="Search channels..." autocomplete="off" aria-label="Search channels">
    <span class="channel-search-icon">⌕</span>
  </div>
  <button type="button" class="channel-search-clear" id="clearChannelSearch" title="Clear search" aria-label="Clear search">✕</button>
</div>

<main>
  <section class="channels-section">
    <div class="section-title">CHANNELS</div>
    <div id="channels" class="channels"></div>
  </section>
</main>

<!--
=========================================================
CHANNEL URLS — CHANGE THESE ONLY
=========================================================

প্রতিবার stream URL পরিবর্তন করতে হলে শুধু নিচের
url: "..." অংশ পরিবর্তন করবে।

name = Channel-এর নাম
logo = Channel logo (optional)
url  = Live .m3u8 stream URL

=========================================================

let CHANNELS = [];
const channelsEl = document.getElementById("channels");
let selectedCategory = "ALL";
let channelSearchTerm = "";
let CENTRAL_DATA_READY = false;

function apiJsonp(params, timeoutMs=22000, retries=4){
  return new Promise((resolve,reject)=>{
    let attempt=0;
    function tryRequest(){
      attempt++;
      const callbackName="soikatApi_"+Date.now()+"_"+Math.random().toString(36).slice(2);
      const script=document.createElement("script"); let finished=false;
      const timer=setTimeout(()=>finish(new Error("Request timed out")),timeoutMs);
      function cleanup(){clearTimeout(timer);try{delete window[callbackName]}catch(e){}script.remove()}
      function finish(err,data){if(finished)return;finished=true;cleanup();if(!err){resolve(data);return}if(attempt<retries)setTimeout(tryRequest,700*attempt);else reject(err)}
      window[callbackName]=data=>finish(null,data);
      script.onerror=()=>finish(new Error("Failed to reach Google Apps Script"));
      const query=new URLSearchParams({...params,callback:callbackName,t:Date.now()});
      script.src=API_URL+"?"+query.toString(); document.head.appendChild(script);
    }
    tryRequest();
  });
}

function saveLocalCentralData(){
  try{localStorage.setItem("SOIKAT_LIVE_TV_DATA",JSON.stringify({channels:CHANNELS,categories:CATEGORIES,savedAt:Date.now()}))}catch(e){}
}

function loadLocalCentralData(){
  try{
    const raw=localStorage.getItem("SOIKAT_LIVE_TV_DATA"); if(!raw)return false;
    const d=JSON.parse(raw); if(!d||!Array.isArray(d.channels)||!Array.isArray(d.categories))return false;
    CHANNELS=d.channels; CATEGORIES=d.categories; CENTRAL_DATA_READY=true;
    renderPublicCategories(); renderChannels(); return true;
  }catch(e){return false}
}

function renderPublicCategories(){
  const wrap = document.getElementById("categories");
  if(!wrap) return;
  const active = selectedCategory || "ALL";
  wrap.innerHTML = `<button class="category ${active==="ALL"?"active":""}" data-category="ALL">ALL</button>` +
    CATEGORIES.map(cat => `<button class="category ${active===String(cat).toUpperCase()?"active":""}" data-category="${escapeAttr(String(cat).toUpperCase())}">${escapeHtml(String(cat).toUpperCase())}</button>`).join("");
  wrap.querySelectorAll(".category").forEach(button => {
    button.addEventListener("click", function(){
      wrap.querySelectorAll(".category").forEach(b => b.classList.remove("active"));
      this.classList.add("active");
      selectedCategory = String(this.dataset.category || "ALL").toUpperCase();
      renderChannels();
    });
  });
}

async function loadCentralData(){
  const wrap = document.getElementById("categories");

  if(!API_URL || API_URL.includes("PASTE_YOUR_")){
    if(wrap) wrap.innerHTML = "";
    channelsEl.innerHTML = `
      <div class="empty-category">
        <div class="empty-category-title">DATA SOURCE NOT CONFIGURED</div>
        <div class="empty-category-text">Central Live TV data is not configured.</div>
      </div>`;
    return;
  }

  const cached=loadLocalCentralData();

  try{
    const data = await apiJsonp({action:"get"});
    if(!data || !data.ok) throw new Error((data&&data.error)||"Central data unavailable");
    CATEGORIES=Array.isArray(data.categories)?data.categories:[];
    CHANNELS=Array.isArray(data.channels)?data.channels:[];
    CENTRAL_DATA_READY=true;
    saveLocalCentralData();
    renderPublicCategories(); renderChannels();
  }catch(error){
    console.error("Central Live TV data unavailable:", error);
    CENTRAL_DATA_READY = cached;

    if(cached){
      renderPublicCategories();
      renderChannels();
      return;
    }

    if(wrap){
      wrap.innerHTML = `<div class="category-loading">Unable to load categories</div>`;
    }
    channelsEl.innerHTML = `
      <div class="empty-category">
        <div class="empty-category-title">UNABLE TO LOAD DATA</div>
        <div class="empty-category-text">Please refresh and try again.</div>
      </div>`;
  }
}

function renderChannels(){
  const term = channelSearchTerm.trim().toLowerCase();
  const list = CHANNELS.filter(channel => {
    const categoryMatch = selectedCategory === "ALL" ||
      String(channel.category || "").toUpperCase() === selectedCategory;
    const searchMatch = !term ||
      String(channel.name || "").toLowerCase().includes(term);
    return categoryMatch && searchMatch;
  });

  if(!list.length){
    channelsEl.innerHTML = `
      <div class="empty-category">
        <div class="empty-category-title">NO CHANNELS</div>
        <div class="empty-category-text">${term ? `No channels found for “${escapeHtml(channelSearchTerm)}”.` : `No channels are available in ${selectedCategory} yet.`}</div>
      </div>`;
    return;
  }

  channelsEl.innerHTML = list.map(channel => `
    <a class="channel-card" href="${escapeAttr(channel.url)}" target="_blank" rel="noopener noreferrer">
      <div class="channel-logo">
        ${channel.logo
          ? `<img src="${escapeAttr(channel.logo)}" alt="" referrerpolicy="no-referrer">`
          : `<span>${String(channel.name || "?").charAt(0).toUpperCase()}</span>`}
      </div>
      <div class="channel-name">${escapeHtml(channel.name)}</div>
      <div class="channel-open">OPEN</div>
    </a>
  `).join("");
}

function escapeHtml(value){
  return String(value).replace(/[&<>"']/g, ch => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[ch]));
}
function escapeAttr(value){ return escapeHtml(value); }

const channelSearchInput = document.getElementById("channelSearch");
const clearChannelSearch = document.getElementById("clearChannelSearch");
if(channelSearchInput){
  channelSearchInput.addEventListener("input", () => {
    channelSearchTerm = channelSearchInput.value;
    renderChannels();
  });
}
if(clearChannelSearch){
  clearChannelSearch.addEventListener("click", () => {
    channelSearchTerm = "";
    if(channelSearchInput) channelSearchInput.value = "";
    renderChannels();
    channelSearchInput?.focus();
  });
}
// Press / anywhere on the user page to focus channel search.
document.addEventListener("keydown", e => {
  if(e.key === "/" && document.activeElement?.tagName !== "INPUT" && document.activeElement?.tagName !== "TEXTAREA" && document.activeElement?.tagName !== "SELECT"){
    e.preventDefault();
    channelSearchInput?.focus();
  }
  if(e.key === "Escape" && document.activeElement === channelSearchInput){
    channelSearchInput.value = "";
    channelSearchTerm = "";
    renderChannels();
    channelSearchInput.blur();
  }
});

async function openAdmin(){
  const adminModal = document.getElementById("adminModal");
  if(!adminModal) return;
  adminModal.classList.add("show");

  if(!CENTRAL_DATA_READY){
    try{
      const data = await apiJsonp({action:"get"});
      if(data && data.ok){
        CATEGORIES = Array.isArray(data.categories) ? data.categories : [];
        CHANNELS = Array.isArray(data.channels) ? data.channels : [];
        CENTRAL_DATA_READY = true;
      }
    }catch(e){}
  }

  renderAdmin();
}
function closeAdmin(){
  const adminModal = document.getElementById("adminModal");
  if(!adminModal) return;
  adminModal.classList.remove("show");
}
function categoryOptions(selected){
  const current = String(selected||"").toUpperCase();
  const cats = CATEGORIES.slice();
  if(current && !cats.includes(current)) cats.unshift(current);
  return cats.map(cat => `<option value="${escapeAttr(cat)}" ${current===cat?"selected":""}>${escapeHtml(cat)}</option>`).join("");
}

function renderCategoryManager(){
  const list=document.getElementById("categoryList");
  if(!list)return;
  list.innerHTML=CATEGORIES.map(cat=>`
    <div class="category-item">
      <span>${escapeHtml(cat)}</span>
      <button type="button" class="category-delete" onclick="requestDeleteCategory('${escapeAttr(cat)}')" title="Delete category" aria-label="Delete category">🗑️</button>
    </div>
  `).join("") || `<div class="admin-empty">No custom categories.</div>`;
}

function openCategoryManager(){
  renderCategoryManager();
  document.getElementById("categoryManagerModal").classList.add("show");
}
function closeCategoryManager(){
  document.getElementById("categoryManagerModal").classList.remove("show");
}

function openCreateCategoryModal(){
  document.getElementById("newCategoryInput").value="";
  document.getElementById("categoryCreateModal").classList.add("show");
  setTimeout(()=>document.getElementById("newCategoryInput").focus(),50);
}
function closeCreateCategoryModal(){
  document.getElementById("categoryCreateModal").classList.remove("show");
}

async function createCategoryFromModal(){
  const input=document.getElementById("newCategoryInput");
  const name=String(input.value||"").trim().replace(/\s+/g," ");
  if(!name){ input.focus(); return; }
  const category=name.toUpperCase();
  if(CATEGORIES.some(c=>String(c).toUpperCase()===category)){
    input.focus();
    input.select();
    setAdminMessage("Category already exists.","err");
    return;
  }
  try{
    const data=await apiJsonp({action:"createCategory",category});
    if(!data || !data.ok) throw new Error((data&&data.error)||"Category creation failed");
    CATEGORIES=Array.isArray(data.categories)?data.categories:[...CATEGORIES,category];
    renderCategoryManager();
    renderAdmin();
    renderPublicCategories();
    closeCreateCategoryModal();
    setAdminMessage("Category created: "+category,"ok");
  }catch(e){
    setAdminMessage("Category creation failed: "+e.message,"err");
  }
}

function requestDeleteCategory(category){
  openConfirm(
    "Delete Category",
    `Delete "<strong>${escapeHtml(category)}</strong>" category?`,
    ()=>deleteCategory(category)
  );
}

async function deleteCategory(category){
  const target=String(category).trim().toUpperCase();
  try{
    const data=await apiJsonp({
      action:"deleteCategory",
      category:target
    });
    if(!data || !data.ok) throw new Error((data&&data.error)||"Category deletion failed");

    // IMPORTANT: deleting a category does NOT delete or modify any stream.
    // The streams keep their category value, so they remain visible in ALL.
    CATEGORIES=Array.isArray(data.categories)
      ? data.categories
      : CATEGORIES.filter(c=>String(c).toUpperCase()!==target);

    renderCategoryManager();
    renderAdmin();
    renderPublicCategories();
    closeConfirm();
    setAdminMessage("Category deleted: "+category,"ok");
  }catch(e){
    setAdminMessage("Category deletion failed: "+e.message,"err");
    closeConfirm();
  }
}

let confirmAction=null;
function openConfirm(title,message,action){
  document.getElementById("confirmTitle").textContent=title;
  document.getElementById("confirmText").innerHTML=message;
  confirmAction=action;
  document.getElementById("confirmModal").classList.add("show");
}
function closeConfirm(){
  confirmAction=null;
  document.getElementById("confirmModal").classList.remove("show");
}
async function confirmYes(){
  const action=confirmAction;
  const btn=document.querySelector('#confirmModal .confirm-delete');
  if(!action) return;
  if(btn){ btn.disabled=true; btn.textContent='⏳'; }
  try{
    await action();
  }catch(e){
    setAdminMessage(e?.message || 'Action failed.','err');
  }finally{
    if(btn){ btn.disabled=false; btn.textContent='DELETE'; }
  }
}
function renderAdmin(){
  const list = CHANNELS.map((c,i)=>`
    <div class="admin-row" data-row="${i}">
      <div class="admin-title">
        <div class="admin-left">
          <span class="admin-serial">${i + 1}</span>
          <input class="admin-name" data-key="name" value="${escapeAttr(c.name || "")}" placeholder="Channel name">
          <select class="admin-category" data-key="category" data-previous="${escapeAttr(String(c.category || "").toUpperCase())}" onchange="this.dataset.previous=this.value">
            ${categoryOptions(c.category)}
          </select>
        </div>
        <div class="admin-right">
          <button type="button" class="admin-move" onclick="moveChannel(${i},-1)" ${i===0?"disabled":""} title="Move up" aria-label="Move up">▲</button>
          <button type="button" class="admin-move" onclick="moveChannel(${i},1)" ${i===CHANNELS.length-1?"disabled":""} title="Move down" aria-label="Move down">▼</button>
          <button type="button" class="admin-delete" onclick="deleteStream(${i})" title="Delete stream" aria-label="Delete stream">🗑️</button>
        </div>
      </div>
      <div class="admin-fields">
        <div class="admin-field-wrap">
          <input data-key="logo" value="${escapeAttr(c.logo || "")}" placeholder="Logo URL / data image">
        </div>
        <div class="admin-field-wrap">
          <input data-key="url" value="${escapeAttr(c.url || "")}" placeholder="Stream URL (.m3u8)">
          <button type="button" class="admin-open-link" onclick="openAdminLink(this,'url')" title="Open stream URL" aria-label="Open stream URL">🔗</button>
        </div>
        <div class="admin-field-wrap">
          <input data-key="source" value="${escapeAttr(c.source || "")}" placeholder="Source URL">
          <button type="button" class="admin-open-link" onclick="openAdminLink(this,'source')" title="Open source URL" aria-label="Open source URL">🔗</button>
        </div>
      </div>
    </div>`).join("");

  document.getElementById("adminRows").innerHTML = list || `<div class="admin-empty">No channels. Click ADD NEW STREAM.</div>`;
}

function moveChannel(index, direction){
  const nextIndex = index + direction;
  if(index < 0 || nextIndex < 0 || nextIndex >= CHANNELS.length) return;

  const next = CHANNELS.slice();
  [next[index], next[nextIndex]] = [next[nextIndex], next[index]];
  CHANNELS = next;
  renderAdmin();
  setAdminMessage(`Channel moved to serial ${nextIndex + 1}. Saving automatically…`, "ok");
  scheduleAutoSave();
}

function openAdminLink(button,key){
  const wrap=button?.closest('.admin-field-wrap');
  const input=wrap?.querySelector(`[data-key="${key}"]`);
  const raw=String(input?.value || '').trim();
  if(!raw){
    setAdminMessage(key === 'url' ? 'Stream URL is empty.' : 'Source URL is empty.','err');
    input?.focus();
    return;
  }
  let url=raw;
  if(!/^https?:\/\//i.test(url) && !/^data:/i.test(url)) url='https://'+url;
  if(/^data:/i.test(url)){
    setAdminMessage('This is a data image, not a web link.','err');
    return;
  }
  window.open(url,'_blank','noopener,noreferrer');
}

function collectAdminChannels(){
  return Array.from(document.querySelectorAll("#adminRows .admin-row")).map(row=>{
    const obj = {};
    row.querySelectorAll("[data-key]").forEach(el=>{ obj[el.dataset.key] = el.value.trim(); });
    return obj;
  });
}

function addStream(){
  CHANNELS.push({name:"New Channel",category:"MUSIC",logo:"",url:"",source:""});
  renderAdmin();
  const rows = document.querySelectorAll("#adminRows .admin-row");
  const last = rows[rows.length-1];
  if(last){
    last.scrollIntoView({behavior:"smooth",block:"nearest"});
    const name = last.querySelector('[data-key="name"]');
    if(name){ name.focus(); name.select(); }
  }
  setAdminMessage("New stream added. Saving automatically…","ok");
  scheduleAutoSave();
}

function deleteStream(index){
  if(index < 0 || index >= CHANNELS.length) return;
  const name = CHANNELS[index]?.name || "this stream";
  openConfirm(
    "Delete Stream",
    `Delete <strong>${escapeHtml(name)}</strong> stream?`,
    async ()=>{
      CHANNELS.splice(index,1);
      renderAdmin();
      renderChannels();
      closeConfirm();
      setAdminMessage("Stream deleted. Saving automatically…","ok");
      scheduleAutoSave();
    }
  );
}

let autoSaveTimer=null;
let autoSaveBusy=false;

async function autoSaveNow(){
  if(autoSaveBusy) return;
  autoSaveBusy=true;
  setAdminSaveStatus("🔄");
  try{
    const next=collectAdminChannels();
    if(!API_URL || API_URL.includes("PASTE_YOUR_")) throw new Error("API URL not configured");

    // One request saves the complete current state.
    const data=await apiJsonp({
      action:"save",
      data:JSON.stringify({channels:next,categories:CATEGORIES})
    },12000,3);
    if(!data || !data.ok) throw new Error((data&&data.error)||"Save failed");

    CHANNELS=Array.isArray(data.channels)?data.channels:next;
    CATEGORIES=Array.isArray(data.categories)?data.categories:CATEGORIES;
    saveLocalCentralData();
    renderChannels();
    renderPublicCategories();
    // Do NOT re-render the admin form here. Re-rendering replaces the input
    // elements and makes the field being edited look like it refreshed/cleared.
    setAdminSaveStatus("✅");
  }catch(e){
    setAdminSaveStatus("❌","error");
  }finally{
    autoSaveBusy=false;
  }
}

function scheduleAutoSave(){
  clearTimeout(autoSaveTimer);
  setAdminSaveStatus("🔄");
  autoSaveTimer=setTimeout(autoSaveNow,180);
}

function setAdminSaveStatus(text,type="saved"){
  const el=document.getElementById("adminSaveStatus");
  if(!el) return;
  el.textContent=text;
  el.className="admin-save-status "+(type||"");
}

function setAdminMessage(text,type){
  if(type === "ok" || /saving automatically|saved automatically/i.test(String(text))){
    setAdminSaveStatus(/saving/i.test(String(text)) ? "Saving..." : "Saved.");
    return;
  }
  const el=document.getElementById("adminMessage");
  if(el){el.textContent=text;el.className="admin-message "+type;}
}

document.addEventListener("input", function(e){
  if(e.target.closest && e.target.closest("#adminRows")){
    scheduleAutoSave();
  }
});

document.addEventListener("change", function(e){
  if(e.target.closest && e.target.closest("#adminRows")){
    scheduleAutoSave();
  }
});

function updateClock(){
  document.getElementById("clock").textContent=new Date().toLocaleString("en-GB",{
    day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit",hour12:true
  });
}
updateClock();
setInterval(updateClock,1000);
</script>

    <div class="category-manager-body">
      <div class="category-list" id="categoryList"></div>
      <button type="button" class="category-create" onclick="openCreateCategoryModal()">CREATE NEW CATEGORY</button>
    </div>
  </div>
</div>

<div class="confirm-modal" id="confirmModal" onclick="if(event.target===this)closeConfirm()">
  <div class="confirm-box">
    <div class="confirm-head">
      <h3 id="confirmTitle">Delete Category</h3>
      <button class="admin-close" onclick="closeConfirm()" aria-label="Close">×</button>
    </div>
    <div class="confirm-body">
      <div class="confirm-icon">🗑️</div>
      <div class="confirm-text" id="confirmText"></div>
      <div class="confirm-actions">
        <button type="button" class="confirm-cancel" onclick="closeConfirm()">CANCEL</button>
        <button type="button" class="confirm-delete" onclick="confirmYes()">DELETE</button>
      </div>
    </div>
  </div>
</div>

<div class="category-manager-modal category-create-modal" id="categoryCreateModal" onclick="if(event.target===this)closeCreateCategoryModal()">
  <div class="confirm-box">
    <div class="confirm-head">
      <h3>CREATE NEW CATEGORY</h3>
      <button class="admin-close" onclick="closeCreateCategoryModal()" aria-label="Close">×</button>
    </div>
    <div class="confirm-body">
      <input id="newCategoryInput" class="form-input" placeholder="Category name" onkeydown="if(event.key==='Enter')createCategoryFromModal()">
      <div class="confirm-actions">
        <button type="button" class="confirm-cancel" onclick="closeCreateCategoryModal()">CANCEL</button>
        <button type="button" class="confirm-delete" style="border-color:#31547e;background:#326fe7" onclick="createCategoryFromModal()">CREATE</button>
      </div>
    </div>
  </div>
</div>

<div class="admin-modal" id="adminModal" onclick="if(event.target===this)closeAdmin()">
  <div class="admin-panel">
    <div class="admin-head">
      <h2>SOIKAT · LIVE TV ADMIN</h2>
      <div class="admin-toolbar">
        <button class="admin-emoji secondary" id="addStream" onclick="addStream()" title="Add new stream" aria-label="Add new stream">➕</button>
        <button class="admin-emoji secondary" id="manageCategories" onclick="openCategoryManager()" title="Manage categories" aria-label="Manage categories">🏷️</button>
        <span class="admin-save-status" id="adminSaveStatus" title="Auto save status"></span>
      </div>
      <button class="admin-close" onclick="closeAdmin()" aria-label="Close">×</button>
    </div>
    <div class="admin-content">
      <div id="adminRows"></div>
      <div id="adminMessage" class="admin-message"></div>
    </div>
  </div>
</div>
</body>
</html>
