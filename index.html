<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOIKAT — PERSONAL OS</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif}
  body{
    background:#07090d;
    color:#f5f7fb;
    min-height:100vh;
  }
  .wrap{
    width:min(1200px,94%);
    margin:0 auto;
    padding:46px 0 70px;
  }
  .brand{
    text-align:center;
    margin-bottom:54px;
  }
  .brand h1{
    margin:0;
    font-size:40px;
    line-height:1;
    letter-spacing:7px;
    font-weight:800;
  }
  .brand p{
    margin:22px 0 0;
    color:#78869a;
    font-size:14px;
    letter-spacing:7px;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:22px;
  }
  .card{
    position:relative;
    min-height:212px;
    padding:34px 36px;
    border:1px solid #202a37;
    border-radius:15px;
    background:linear-gradient(145deg,#10141a,#0b0e13);
    text-decoration:none;
    color:#fff;
    display:flex;
    align-items:flex-end;
    overflow:hidden;
    transition:border-color .2s ease,transform .2s ease,background .2s ease;
  }
  .card:hover{
    transform:translateY(-2px);
    border-color:#344253;
    background:linear-gradient(145deg,#121821,#0c1016);
  }
  .number{
    position:absolute;
    top:29px;
    right:31px;
    color:#65748a;
    font-size:13px;
    letter-spacing:.5px;
  }
  .title{
    font-size:24px;
    font-weight:700;
    letter-spacing:-.4px;
  }
  footer{
    text-align:center;
    color:#56657a;
    font-size:11px;
    padding:40px 0 24px;
  }
  @media(max-width:700px){
    .wrap{padding-top:32px}
    .brand{margin-bottom:38px}
    .brand h1{font-size:31px;letter-spacing:5px}
    .brand p{font-size:11px;letter-spacing:5px}
    .grid{grid-template-columns:1fr}
    .card{min-height:170px}
  }
</style>
</head>
<body>
  <main class="wrap">
    <header class="brand">
      <h1>SOIKAT</h1>
      <p>PERSONAL OS</p>
    </header>

    <section class="grid">
      <a class="card" href="goal.html">
        <span class="number">01</span>
        <span class="title">100K GOAL</span>
      </a>

      <a class="card" href="study.html">
        <span class="number">02</span>
        <span class="title">200D PLAN</span>
      </a>

      <a class="card" href="todo-notes.html">
        <span class="number">03</span>
        <span class="title">TODO + NOTES</span>
      </a>

      <a class="card" href="reports.html">
        <span class="number">04</span>
        <span class="title">REPORTS</span>
      </a>

      <div class="card" aria-hidden="true">
        <span class="number">05</span>
        <span class="title">...</span>
      </div>
    </section>
  </main>

  <footer>Built with ❤️ by Soikat</footer>
  <script src="cloud.js"></script>
</body>
</html>
