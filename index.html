<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOIKAT — PERSONAL OS</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    background:#030914;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
    overflow-x:hidden;
}

/* ================= BACKGROUND ================= */

body::before{
    content:"";
    position:fixed;
    inset:0;
    z-index:-3;

    background:
        radial-gradient(
            circle at 5% 0%,
            rgba(20,75,210,.28),
            transparent 32%
        ),
        radial-gradient(
            circle at 100% 100%,
            rgba(120,35,220,.22),
            transparent 32%
        ),
        linear-gradient(
            135deg,
            #020812,
            #050c18 55%,
            #080412
        );
}

body::after{
    content:"";
    position:fixed;
    inset:0;
    z-index:-2;

    background-image:
        linear-gradient(
            rgba(70,120,255,.065) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(70,120,255,.065) 1px,
            transparent 1px
        );

    background-size:72px 72px;

    transform:
        perspective(700px)
        rotateX(58deg)
        scale(1.5)
        translateY(12%);

    transform-origin:center bottom;
}

/* ================= CONTAINER ================= */

.container{
    width:min(1440px,92%);
    min-height:100vh;
    margin:auto;

    padding:
        clamp(45px,6vw,80px)
        0
        30px;
}

/* ================= HEADER ================= */

.header{
    text-align:center;
    margin-bottom:clamp(40px,5vw,60px);
}

.logo{
    font-size:clamp(48px,7vw,90px);
    font-weight:900;
    line-height:1;

    letter-spacing:
        clamp(9px,1.6vw,20px);

    margin-left:
        clamp(9px,1.6vw,20px);

    background:
        linear-gradient(
            110deg,
            #72a9ff,
            #ffffff 30%,
            #a9baff 52%,
            #ffffff 70%,
            #927cff
        );

    background-size:250% auto;

    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;

    text-shadow:
        0 0 35px rgba(80,120,255,.2);

    animation:logoShine 7s linear infinite;
}

@keyframes logoShine{
    to{
        background-position:250% center;
    }
}

.subtitle{
    margin-top:18px;

    color:#6c7fa6;

    font-size:
        clamp(9px,1vw,13px);

    font-weight:600;

    letter-spacing:
        clamp(5px,1vw,10px);
}

.header-line{
    width:175px;
    max-width:35vw;
    height:1px;

    margin:24px auto 0;

    background:
        linear-gradient(
            90deg,
            transparent,
            #367fff,
            #9b60ff,
            transparent
        );

    box-shadow:
        0 0 15px rgba(70,120,255,.6);
}

/* ================= GRID ================= */

.cards{
    display:grid;

    grid-template-columns:
        repeat(2,minmax(0,1fr));

    gap:
        clamp(16px,1.6vw,24px);
}

/* ================= CARD ================= */

.card{
    position:relative;

    height:
        clamp(220px,22vw,285px);

    overflow:hidden;

    border-radius:
        clamp(16px,1.5vw,22px);

    background:#07101c;

    border:1px solid rgba(90,145,255,.55);

    text-decoration:none;
    color:white;

    isolation:isolate;

    transition:
        transform .4s ease,
        box-shadow .4s ease,
        border-color .4s ease;
}

.card:hover{
    transform:translateY(-7px);

    border-color:
        rgba(120,180,255,.95);

    box-shadow:
        0 25px 70px rgba(0,0,0,.5),
        0 0 35px rgba(60,120,255,.16);
}


/* =========================================================
   CINEMATIC ART
========================================================= */

.art{
    position:absolute;
    inset:0;

    z-index:-3;

    overflow:hidden;
}

.art::after{
    content:"";
    position:absolute;
    inset:0;

    background:
        linear-gradient(
            90deg,
            rgba(2,8,17,.97) 0%,
            rgba(2,8,17,.86) 30%,
            rgba(2,8,17,.52) 55%,
            rgba(2,8,17,.16) 80%,
            rgba(2,8,17,.08)
        ),
        linear-gradient(
            to top,
            rgba(1,5,12,.8),
            transparent 65%
        );

    z-index:20;
}


/* =========================================================
   100K GOAL ART
========================================================= */

.goal-art{
    background:
        radial-gradient(
            circle at 72% 50%,
            rgba(255,172,45,.28),
            transparent 28%
        ),
        linear-gradient(
            135deg,
            #06101e,
            #0a1a2c 50%,
            #291505
        );
}

.goal-table{
    position:absolute;

    left:42%;
    right:-5%;
    bottom:0;

    height:18%;

    background:
        linear-gradient(
            to bottom,
            #5b3518,
            #1b1009
        );

    transform:
        perspective(300px)
        rotateX(55deg);
}

.coin{
    position:absolute;

    border-radius:50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            #fff1a0,
            #f3ae32 45%,
            #7a3f08
        );

    box-shadow:
        0 0 15px rgba(255,178,48,.45);

    animation:
        coinFloat 3s ease-in-out infinite alternate;
}

.coin.one{
    width:42px;
    height:13px;

    right:28%;
    bottom:12%;
}

.coin.two{
    width:35px;
    height:11px;

    right:20%;
    bottom:18%;

    animation-delay:.5s;
}

.coin.three{
    width:30px;
    height:10px;

    right:34%;
    bottom:8%;

    animation-delay:1s;
}

@keyframes coinFloat{
    to{
        transform:translateY(-5px);
    }
}

.chart{
    position:absolute;

    right:8%;
    bottom:17%;

    width:52%;
    height:62%;
}

.bar{
    position:absolute;

    bottom:0;

    width:11%;

    border-radius:4px 4px 0 0;

    background:
        linear-gradient(
            to top,
            #9a530b,
            #ffc653
        );

    box-shadow:
        0 0 17px rgba(255,179,53,.32);
}

.bar:nth-child(1){
    left:2%;
    height:20%;
}

.bar:nth-child(2){
    left:18%;
    height:34%;
}

.bar:nth-child(3){
    left:34%;
    height:48%;
}

.bar:nth-child(4){
    left:50%;
    height:66%;
}

.bar:nth-child(5){
    left:66%;
    height:84%;
}

.growth-arrow{
    position:absolute;

    left:5%;
    top:10%;

    width:70%;
    height:65%;

    border-top:
        4px solid #ffc04c;

    transform:
        rotate(-29deg);

    transform-origin:left center;

    filter:
        drop-shadow(
            0 0 9px rgba(255,190,60,.8)
        );
}

.growth-arrow::after{
    content:"";

    position:absolute;

    right:-3px;
    top:-11px;

    width:0;
    height:0;

    border-left:18px solid #ffc04c;
    border-top:10px solid transparent;
    border-bottom:10px solid transparent;

    transform:rotate(18deg);
}

.target{
    position:absolute;

    right:2%;
    bottom:8%;

    width:100px;
    height:100px;

    border:
        4px solid #f2b43c;

    border-radius:50%;

    box-shadow:
        0 0 25px rgba(255,179,47,.45);
}

.target::before{
    content:"";

    position:absolute;

    inset:18px;

    border:
        4px solid #f2b43c;

    border-radius:50%;
}

.target::after{
    content:"";

    position:absolute;

    inset:37px;

    border:
        4px solid #f2b43c;

    border-radius:50%;

    background:#ffb93e;
}


/* =========================================================
   200D PLAN ART
========================================================= */

.plan-art{
    background:
        radial-gradient(
            circle at 75% 45%,
            rgba(50,130,255,.3),
            transparent 30%
        ),
        linear-gradient(
            135deg,
            #06101e,
            #0a1d36 65%,
            #101727
        );
}

.lamp{
    position:absolute;

    right:7%;
    top:-4%;

    width:105px;
    height:82px;

    border-radius:
        55% 55% 15% 15%;

    background:
        linear-gradient(
            135deg,
            #23364e,
            #a0b4cc
        );

    transform:rotate(-8deg);

    box-shadow:
        0 18px 30px rgba(0,0,0,.4);
}

.lamp::after{
    content:"";

    position:absolute;

    left:10px;
    top:50px;

    width:85px;
    height:130px;

    background:
        linear-gradient(
            to bottom,
            rgba(105,168,255,.3),
            transparent
        );

    filter:blur(10px);
}

.books{
    position:absolute;

    right:20%;
    bottom:13%;

    width:42%;
}

.book{
    height:28px;

    margin-top:5px;

    border-radius:3px;

    background:
        linear-gradient(
            90deg,
            #0d1c34,
            #39577f
        );

    box-shadow:
        0 5px 12px rgba(0,0,0,.4);
}

.book span{
    display:block;

    padding:7px 0 0 18px;

    color:#b2c9f5;

    font-size:8px;

    letter-spacing:2px;
}

.calendar{
    position:absolute;

    right:5%;
    bottom:8%;

    width:30%;
    height:58%;

    border-radius:7px;

    background:
        linear-gradient(
            135deg,
            #dfe8f2,
            #7e93b0
        );

    box-shadow:
        0 15px 35px rgba(0,0,0,.45);
}

.calendar-top{
    height:20%;

    background:#315987;
}

.calendar-grid{
    padding:15px;

    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:9px;
}

.calendar-grid i{
    width:13px;
    height:13px;

    border:
        2px solid #315987;

    position:relative;
}

.calendar-grid i::after{
    content:"";

    position:absolute;

    width:7px;
    height:4px;

    left:2px;
    top:1px;

    border-left:2px solid #3868e8;
    border-bottom:2px solid #3868e8;

    transform:rotate(-45deg);
}


/* =========================================================
   NOTEPAD ART
========================================================= */

.note-art{
    background:
        radial-gradient(
            circle at 75% 38%,
            rgba(42,225,180,.18),
            transparent 28%
        ),
        linear-gradient(
            135deg,
            #031414,
            #082724 58%,
            #07171e
        );
}

.note-desk{
    position:absolute;

    left:32%;
    right:-5%;
    bottom:0;

    height:16%;

    background:
        linear-gradient(
            to bottom,
            #31574c,
            #101c1a
        );
}

.notebook{
    position:absolute;

    right:8%;
    bottom:-3%;

    width:52%;
    height:75%;

    border-radius:
        8px 18px 13px 7px;

    background:
        linear-gradient(
            135deg,
            #e0e4d9,
            #a2aa9d
        );

    transform:rotate(-7deg);

    box-shadow:
        -15px 20px 40px rgba(0,0,0,.5);
}

.notebook::before{
    content:"";

    position:absolute;

    inset:9%;

    background:
        repeating-linear-gradient(
            to bottom,
            transparent 0 22px,
            rgba(52,103,89,.25) 23px
        );

    border-left:
        2px solid rgba(50,100,85,.18);
}

.note-lines{
    position:absolute;

    left:18%;
    top:20%;

    color:#33463e;

    font-size:12px;

    line-height:26px;

    font-style:italic;
}

.pen{
    position:absolute;

    right:16%;
    bottom:10%;

    width:9px;
    height:57%;

    border-radius:8px;

    background:
        linear-gradient(
            to bottom,
            #111,
            #bdc8c5
        );

    transform:rotate(31deg);

    box-shadow:
        0 0 12px rgba(50,255,215,.16);
}

.bulb{
    position:absolute;

    right:19%;
    top:8%;

    width:75px;
    height:75px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            #fffbd0 0 8%,
            #ffe46b 24%,
            rgba(255,220,70,.22) 57%,
            transparent 72%
        );

    filter:
        drop-shadow(
            0 0 24px rgba(255,220,80,.8)
        );

    animation:
        bulbGlow 2.5s ease-in-out infinite alternate;
}

@keyframes bulbGlow{
    to{
        transform:scale(1.12);
        opacity:.82;
    }
}


/* =========================================================
   LIVE TV — MODERN SMART TV
========================================================= */

.tv-art{
    background:
        radial-gradient(
            circle at 72% 45%,
            rgba(75,105,255,.22),
            transparent 34%
        ),
        radial-gradient(
            circle at 35% 75%,
            rgba(160,55,255,.12),
            transparent 30%
        ),
        linear-gradient(
            135deg,
            #050811,
            #0a1020 55%,
            #120b1c
        );
}


/* TV BODY */

.television{
    position:absolute;

    right:8%;
    top:12%;

    width:59%;
    height:64%;

    border-radius:12px;

    background:
        linear-gradient(
            145deg,
            #171c27,
            #070a10
        );

    border:3px solid #252c38;

    box-shadow:
        0 25px 45px rgba(0,0,0,.65),
        0 0 35px rgba(70,105,255,.16);

    z-index:5;
}


/* TV SCREEN */

.television::before{
    content:"";

    position:absolute;

    left:3%;
    top:4%;

    width:94%;
    height:83%;

    border-radius:7px;

    background:
        radial-gradient(
            circle at 30% 25%,
            rgba(255,255,255,.18),
            transparent 18%
        ),
        linear-gradient(
            135deg,
            #172d57,
            #101d3c 38%,
            #37206b 72%,
            #151b3d
        );

    box-shadow:
        inset 0 0 28px rgba(0,0,0,.65),
        0 0 20px rgba(70,110,255,.14);

    animation:
        screenGlow 5s ease-in-out infinite alternate;
}

@keyframes screenGlow{

    0%{
        filter:brightness(.9);
    }

    100%{
        filter:brightness(1.12);
    }

}


/* TV REFLECTION */

.television::after{
    content:"";

    position:absolute;

    left:5%;
    top:7%;

    width:38%;
    height:20%;

    background:
        linear-gradient(
            125deg,
            rgba(255,255,255,.16),
            transparent
        );

    transform:skewX(-20deg);

    opacity:.45;

    z-index:7;
}


/* TV POWER LIGHT */

.tv-power{
    position:absolute;

    right:4%;
    bottom:5%;

    width:5px;
    height:5px;

    border-radius:50%;

    background:#65a2ff;

    box-shadow:
        0 0 10px #65a2ff;

    z-index:10;
}


/* TV STAND */

.tv-stand{
    position:absolute;

    left:30%;
    bottom:8%;

    width:40%;
    height:7px;

    border-radius:10px;

    background:
        linear-gradient(
            90deg,
            #0c1017,
            #394352,
            #0c1017
        );

    box-shadow:
        0 7px 15px rgba(0,0,0,.5);

    z-index:4;
}


/* TV LEG */

.tv-base{
    position:absolute;

    left:44%;
    bottom:1%;

    width:12%;
    height:9%;

    background:
        linear-gradient(
            90deg,
            #0b0f16,
            #252d39,
            #0b0f16
        );

    clip-path:
        polygon(
            35% 0,
            65% 0,
            100% 100%,
            0 100%
        );

    z-index:3;
}


/* REMOTE */

.remote{
    position:absolute;

    right:8%;
    bottom:8%;

    width:22px;
    height:68px;

    border-radius:7px;

    background:
        linear-gradient(
            90deg,
            #0b0e14,
            #2b303a,
            #0b0e14
        );

    transform:rotate(18deg);

    box-shadow:
        0 12px 20px rgba(0,0,0,.55);

    z-index:8;
}

.remote::before{
    content:"";

    position:absolute;

    top:9px;
    left:7px;

    width:8px;
    height:8px;

    border-radius:50%;

    background:#6b82ff;

    box-shadow:
        0 15px 0 #555d6b,
        0 27px 0 #555d6b,
        0 39px 0 #555d6b;
}


/* =========================================================
   CARD CONTENT
========================================================= */

.card-icon{
    position:absolute;

    top:
        clamp(22px,2.2vw,32px);

    left:
        clamp(25px,3vw,42px);

    width:
        clamp(44px,4.4vw,58px);

    height:
        clamp(44px,4.4vw,58px);

    display:flex;

    align-items:center;
    justify-content:center;

    border:1px solid rgba(80,155,255,.75);

    border-radius:13px;

    background:rgba(2,12,25,.55);

    backdrop-filter:blur(8px);

    z-index:30;

    transition:.4s ease;
}

.card:hover .card-icon{
    transform:
        translateY(-3px)
        scale(1.08);
}

.card-icon svg{
    width:55%;
    height:55%;

    fill:none;

    stroke:#70a9ff;

    stroke-width:1.7;

    stroke-linecap:round;
    stroke-linejoin:round;
}

.card-content{
    position:absolute;

    left:
        clamp(28px,3vw,44px);

    bottom:
        clamp(28px,3vw,40px);

    z-index:30;

    max-width:58%;
}

.card-title{
    font-size:
        clamp(23px,2.4vw,39px);

    font-weight:800;

    line-height:1.05;

    letter-spacing:-1px;

    text-shadow:
        0 2px 18px rgba(0,0,0,.8);
}

.card-description{
    margin-top:11px;

    color:#84a1d2;

    font-size:
        clamp(11px,1.1vw,16px);

    line-height:1.4;

    text-shadow:
        0 2px 12px rgba(0,0,0,.8);
}


/* ================= COLORS ================= */

.goal-card{
    border-color:rgba(255,185,60,.65);
}

.goal-card .card-icon{
    border-color:rgba(255,190,70,.75);
}

.goal-card .card-icon svg{
    stroke:#ffc04c;
}

.note-card{
    border-color:rgba(35,225,190,.65);
}

.note-card .card-icon{
    border-color:rgba(35,225,190,.75);
}

.note-card .card-icon svg{
    stroke:#35e6bd;
}

.tv-card{
    border-color:rgba(170,70,255,.7);
}

.tv-card .card-icon{
    border-color:rgba(175,80,255,.75);
}

.tv-card .card-icon svg{
    stroke:#b77cff;
}


/* ================= FOOTER ================= */

.footer{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:35px;
    margin-top:38px;
    padding:0 0 20px;
    color:#8292a2;
    font-size:11px;
    letter-spacing:4px;
    animation:fadeUp 1s .55s both;
}

.footer-line{
    width:150px;
    height:1px;
    background:linear-gradient(90deg,transparent,#526b82);
}

.footer-line.right{
    background:linear-gradient(90deg,#526b82,transparent);
}

.heart{
    color:#ff416c;
    font-size:14px;
    display:inline-block;
    animation:heartbeat 1.8s infinite;
}

@keyframes heartbeat{
    0%,100%{transform:scale(1)}
    10%{transform:scale(1.22)}
    20%{transform:scale(1)}
    30%{transform:scale(1.12)}
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:600px){

    .container{
        width:88%;

        padding:
            42px 0
            28px;
    }

    .header{
        margin-bottom:34px;
    }

    .logo{
        font-size:
            clamp(40px,13vw,55px);

        letter-spacing:
            clamp(6px,2.5vw,10px);

        margin-left:
            clamp(6px,2.5vw,10px);
    }

    .subtitle{
        margin-top:14px;
        font-size:9px;
        letter-spacing:5px;
    }

    .header-line{
        width:115px;
        margin-top:19px;
    }

    .cards{
        grid-template-columns:1fr;
        gap:13px;
    }

    .card{
        height:190px;
        border-radius:16px;
    }

    .card-content{
        left:23px;
        bottom:23px;
        max-width:68%;
    }

    .card-title{
        font-size:22px;
    }

    .card-description{
        margin-top:8px;
        font-size:10px;
    }

    .card-icon{
        top:20px;
        left:22px;

        width:40px;
        height:40px;

        border-radius:10px;
    }

    .chart{
        right:-3%;
        width:58%;
    }

    .target{
        right:-5%;
        width:75px;
        height:75px;
    }

    .books{
        right:12%;
        width:44%;
    }

    .calendar{
        right:0;
        width:32%;
    }

    .notebook{
        right:-5%;
        width:58%;
    }

    .television{
        right:-3%;
        width:62%;
    }

    .remote{
        right:4%;
        bottom:7%;
    }

    /* FOOTER */

    .footer{
        gap:8px;

        margin-top:28px;

        font-size:7px;

        letter-spacing:1px;

        white-space:nowrap;
    }

    .footer::before,
    .footer::after{
        width:25px;
        flex-shrink:0;
    }

    .heart{
        font-size:12px;
    }

}


/* ================= SMALL PHONE ================= */

@media(max-width:380px){

    .container{
        width:90%;
        padding-top:34px;
    }

    .card{
        height:175px;
    }

    .card-content{
        left:20px;
        bottom:20px;
    }

    .card-title{
        font-size:19px;
    }

    .card-description{
        font-size:9px;
    }

    .television{

<script>

/* ================= CARD MOUSE MOVEMENT ================= */

document.querySelectorAll(".card").forEach(card => {

    const art = card.querySelector(".art");

    card.addEventListener("mousemove", e => {

        const rect = card.getBoundingClientRect();

        const x =
            (e.clientX - rect.left) / rect.width - .5;

        const y =
            (e.clientY - rect.top) / rect.height - .5;

        art.style.transform =
            `scale(1.025)
             translate(${x * 7}px,${y * 5}px)`;

    });

    card.addEventListener("mouseleave", () => {

        art.style.transform =
            "scale(1)";

    });

});

</script>
