<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SOIKAT — NOTEPAD</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#030914;
  --panel:#071321;
  --panel2:#091727;
  --line:#1b3557;
  --blue:#3d96ff;
  --purple:#8d63ff;
  --text:#f3f6ff;
  --muted:#8198bd;
  --red:#ff416c;
  --green:#28dca7;
}
html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
body{overflow-x:hidden}
body::before{
  content:"";position:fixed;inset:0;z-index:-2;
  background:
    radial-gradient(circle at 8% 0%,rgba(28,92,210,.23),transparent 32%),
    radial-gradient(circle at 100% 100%,rgba(113,48,220,.17),transparent 32%),
    linear-gradient(135deg,#020812,#050d19 55%,#080412);
}
body::after{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background-image:
    linear-gradient(rgba(70,120,255,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(70,120,255,.035) 1px,transparent 1px);
  background-size:72px 72px;
  transform:perspective(700px) rotateX(58deg) scale(1.5) translateY(12%);
  transform-origin:center bottom;
}
.topbar{
  height:58px;border-bottom:1px solid rgba(105,140,180,.18);
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  gap:20px;padding:0 32px;position:sticky;top:0;z-index:50;
  background:transparent;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
}
.back{color:#82a9df;text-decoration:none;font-size:14px;font-weight:700;letter-spacing:.5px;justify-self:start}
.back:hover{color:#fff}
.logo{
  font-size:15px;font-weight:700;letter-spacing:.18em;
  background:linear-gradient(110deg,#72a9ff,#fff 32%,#a9baff 55%,#927cff);
  background-size:250% auto;
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:
    brandReveal .8s ease forwards,
    brandShine 6s linear infinite,
    brandBreath 4s ease-in-out infinite;
  will-change:background-position,transform,text-shadow,opacity;
}
.clock{justify-self:end;color:#8fa8d0;font-size:13px}
.app{width:min(1480px,96%);margin:auto;padding:16px 0 0;display:grid;grid-template-columns:340px minmax(0,1fr);gap:12px}
.panel{background:rgba(7,19,33,.82);border:1px solid var(--line);border-radius:17px;box-shadow:0 18px 55px rgba(0,0,0,.18);overflow:hidden}
.sidebar{padding:14px;height:calc(100vh - 112px);min-height:520px}
/* Action row: Add Note + Search + Archive on one line */
.mobile-actions{display:grid;grid-template-columns:minmax(0,1fr) 46px 46px;gap:8px;align-items:center;width:100%;}
.mobile-actions .new-btn{width:100%;height:46px;margin:0;font-size:15px;}
.mobile-actions .new-btn span{font-size:22px;margin-right:8px;}
.mobile-actions .search-toggle,.mobile-actions .archive-btn{width:46px;height:46px;margin:0;padding:0;border:1px solid #29476e;border-radius:10px;background:#071525;color:#9ab1d4;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.mobile-actions .search-toggle{font-size:22px;}
.mobile-actions .archive-btn{font-size:18px;}
.mobile-actions .archive-btn span{display:none;}

.new-btn{
  width:100%;height:52px;border:0;border-radius:13px;color:#fff;font-size:20px;font-weight:700;
  background:linear-gradient(110deg,#3198ff,#7257ff);box-shadow:0 12px 30px rgba(59,117,255,.2)
}
.new-btn span{font-size:30px;font-weight:300;vertical-align:-2px;margin-right:14px}
.search{margin-top:12px;height:46px;border:1px solid #29476e;border-radius:12px;display:flex;align-items:center;padding:0 16px;background:#071525}
.search-icon{font-size:24px;color:#87a5d2;margin-right:12px}
.search input{width:100%;background:transparent;border:0;outline:0;color:#fff;font-size:15px}
.search input::placeholder{color:#7890b5}
.archive-btn{width:100%;height:40px;margin-top:10px;border:1px solid #29476e;border-radius:10px;background:#071525;color:#89a6d1;font-size:12px;cursor:pointer}.archive-btn:hover{border-color:#3b8fff;color:#fff}.notes{margin-top:12px;height:calc(100% - 170px);overflow:auto;padding-right:2px}
.notes::-webkit-scrollbar,.editor-body::-webkit-scrollbar{width:5px}
.notes::-webkit-scrollbar-thumb,.editor-body::-webkit-scrollbar-thumb{background:#29466a;border-radius:10px}
.note{
  position:relative;border:1px solid #1e395c;border-radius:12px;background:linear-gradient(90deg,#0a1728,#091625);
  padding:15px 16px 14px 30px;margin-bottom:10px;cursor:pointer;transition:.18s
}
.note::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:5px;border-radius:0 5px 5px 0;background:#3e91ff}
.note:nth-child(2)::before{background:#9a5dff}
.note:nth-child(3)::before{background:#2ce0aa}
.note:nth-child(4)::before{background:#ffd329}
.note:nth-child(5)::before{background:#ff426d}
.note:nth-child(6)::before{background:#ff9a35}
.note.active{border-color:#328eff;box-shadow:0 0 0 1px #328eff33 inset}
.note-title{font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:28px}
.pin{position:absolute;right:16px;top:15px;color:#579cff;font-size:15px}
.editor{height:calc(100vh - 112px);min-height:520px;padding:14px 16px}
.title-input{
  width:100%;height:58px;border:1px solid #28486d;border-radius:13px;background:#071525;
  color:#fff;padding:0 18px;font-size:24px;font-weight:700;outline:none
}
.title-input:focus{border-color:#398fff;box-shadow:0 0 0 2px #398fff18}
.note-current-date{margin-top:8px;color:#86a1ca;font-size:12px;padding-left:2px}.note-reminder-icon{margin-left:7px;color:#68b0ff;font-size:13px}
.toolbar{display:flex;align-items:center;gap:8px;margin:10px 0}
.date-box,.tool-btn,.save-state{
  height:54px;border:1px solid #223f64;border-radius:12px;background:#071525;
  color:#89a6d1;display:flex;align-items:center;padding:0 16px
}
.date-box{font-size:14px}
.current-date-box{width:max-content;margin-top:8px;height:38px;padding:0 10px;font-size:12px;gap:7px}
.spacer{flex:1}
.tool-btn{font-size:14px;gap:9px}.icon-btn{width:38px;height:38px;justify-content:center;padding:0;font-size:15px}.date-box{height:38px;padding:0 10px;font-size:12px}.toolbar{gap:7px}
.tool-btn.pin-btn{color:#5ca1ff;border-color:#223f64}.tool-btn.pin-btn.pinned{border-color:#328eff;box-shadow:0 0 0 1px #328eff33 inset}
.tool-btn.delete{color:#ff496d}
.save-state{gap:9px}
.dot{width:12px;height:12px;border-radius:50%;background:#28dca7;box-shadow:0 0 10px #28dca766}
.editor-body{
  height:calc(100% - 116px);min-height:300px;border:1px solid #223f64;border-radius:13px;
  background:linear-gradient(145deg,#071321,#050f1b);padding:16px 20px;display:flex;flex-direction:column
}
.editor-checklist-btn{position:absolute;top:9px;right:10px;z-index:3;width:32px;height:32px;border:1px solid #223f64;border-radius:8px;background:#071525;color:#9ab1d4;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;padding:0}.editor-checklist-btn:hover{border-color:#3b8fff;color:#fff}.editor-body{position:relative}
.content{flex:1;width:100%;resize:none;border:0;outline:0;background:transparent;color:#dfe9fa;font-size:18px;line-height:1.6;font-family:Arial,Helvetica,sans-serif}
.content::placeholder{color:#6680a8}
.counter{text-align:right;color:#7892b8;font-size:12px;padding-top:8px}
footer{display:flex;align-items:center;justify-content:center;gap:35px;margin-top:38px;padding:0 0 20px;color:#8292a2;font-size:11px;letter-spacing:4px}
.footer-line{width:150px;height:1px;background:linear-gradient(90deg,transparent,#526b82)}
.footer-line.right{background:linear-gradient(90deg,#526b82,transparent)}
.heart{color:#ff416c;font-size:14px;display:inline-block;animation:heartbeat 1.8s infinite}
@keyframes heartbeat{0%,100%{transform:scale(1)}10%{transform:scale(1.22)}20%{transform:scale(1)}30%{transform:scale(1.12)}}




.countdown-display{flex:none;margin-bottom:10px;padding:8px 10px;border:1px solid #29476e;border-radius:10px;background:#071525;color:#a9c5ef;font-size:13px;font-weight:700;text-align:center;letter-spacing:.2px}
.feature-btn{width:36px;height:36px;border:1px solid #223f64;border-radius:9px;background:#071525;color:#9ab1d4;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;padding:0}
.feature-btn:hover{border-color:#3b8fff;color:#fff}
.feature-btn.active{border-color:#328eff;color:#fff;box-shadow:0 0 0 1px #328eff33 inset}
.note-meta span{display:inline-flex;align-items:center}
.feature-modal{display:none;position:fixed;inset:0;z-index:300;background:rgba(1,6,14,.78);backdrop-filter:blur(9px);align-items:center;justify-content:center;padding:18px}
.feature-modal.show{display:flex}
.feature-box{width:min(430px,100%);background:#071321;border:1px solid #29476e;border-radius:16px;box-shadow:0 25px 80px rgba(0,0,0,.55);overflow:hidden}
.feature-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid #1b3557}
.feature-head strong{font-size:15px;letter-spacing:1px}
.feature-body{padding:18px}
.feature-body label{display:block;color:#88a2c7;font-size:11px;margin:0 0 7px}
.feature-body input[type="date"],.feature-body input[type="time"]{width:100%;height:43px;border:1px solid #29476e;border-radius:9px;background:#071525;color:#fff;padding:0 11px;outline:0;margin-bottom:13px;cursor:pointer;color-scheme:dark;appearance:auto;-webkit-appearance:auto}.feature-body input[type="date"]::-webkit-calendar-picker-indicator,.feature-body input[type="time"]::-webkit-calendar-picker-indicator{opacity:1;cursor:pointer;filter:invert(1)}
.feature-body input:focus{border-color:#398fff}
.feature-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.feature-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
.feature-actions button{height:36px;border:1px solid #29476e;border-radius:8px;background:#071525;color:#9ab0d2;padding:0 12px;cursor:pointer;font-size:11px}
.feature-actions .primary{color:#fff;border-color:#328eff;background:#12315a}
.feature-actions .danger{color:#ff5576;border-color:#6d2940}
.countdown-badge{color:#b99cff!important}
.reminder-badge{color:#68b0ff!important}
.reminder-display{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
.reminder-fixed{color:#68b0ff}.reminder-live{color:#b99cff}.reminder-sep{color:#4f678b}
.editor{position:relative}
.mobile-editor-close{display:none}
@media(max-width:600px){
  .editor{display:none;position:fixed;inset:0;z-index:120;width:100%;height:100dvh;min-height:0;margin:0;padding:10px;border-radius:0;overflow:auto;background:#030914}
  .editor.mobile-open{display:block}
  .mobile-editor-close{display:flex;position:absolute;right:10px;top:10px;width:36px;height:36px;border:1px solid #29476e;border-radius:9px;background:#071525;color:#b8c9e3;align-items:center;justify-content:center;font-size:20px;cursor:pointer;z-index:5}
}

@media(max-width:600px){
  .toolbar{display:flex;flex-wrap:nowrap;align-items:center;gap:6px;min-width:0;overflow:hidden}
  .current-date-box{flex:1 1 auto;min-width:0;width:auto;margin-top:8px;overflow:hidden}
  .current-date-box span:last-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .toolbar .spacer{display:none}
  .feature-btn{width:34px;height:34px;min-width:34px;flex:0 0 34px;font-size:14px}
  .toolbar .icon-btn{width:36px;height:36px;min-width:36px;flex:0 0 36px}
  .feature-row{grid-template-columns:1fr}
  .feature-box{width:100%}
}

.archive-reader{display:none;position:fixed;inset:0;z-index:250;background:rgba(1,6,14,.78);backdrop-filter:blur(9px);align-items:center;justify-content:center;padding:18px}
.archive-reader.show{display:flex}
.reader-box{width:min(760px,100%);max-height:88vh;background:#071321;border:1px solid #29476e;border-radius:16px;box-shadow:0 25px 80px rgba(0,0,0,.55);overflow:hidden;display:flex;flex-direction:column}
.reader-head{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:17px 18px;border-bottom:1px solid #1b3557}
.reader-title{font-size:19px;font-weight:800;color:#f3f6ff;word-break:break-word}
.reader-date{margin-top:6px;color:#7f99bd;font-size:11px}
.reader-content{padding:22px 24px;overflow:auto;white-space:pre-wrap;word-break:break-word;color:#dfe9fa;font-size:16px;line-height:1.7;min-height:180px}
.reader-actions{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid #1b3557}
.reader-actions button{height:34px;border:1px solid #29476e;border-radius:8px;background:#071525;padding:0 11px;cursor:pointer;font-size:11px}
.reader-actions .restore{color:#35dca9;border-color:#236b59}
.reader-actions .forever{color:#ff5576;border-color:#6d2940}

.archive-modal{display:none;position:fixed;inset:0;z-index:200;background:rgba(1,6,14,.72);backdrop-filter:blur(8px);align-items:center;justify-content:center;padding:18px}
.archive-modal.show{display:flex}
.archive-box{width:min(720px,100%);max-height:min(720px,90vh);background:#071321;border:1px solid #29476e;border-radius:16px;box-shadow:0 25px 80px rgba(0,0,0,.5);overflow:hidden}
.archive-head{height:62px;padding:0 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #1b3557}
.archive-head strong{font-size:16px;letter-spacing:1px}
.archive-close{width:34px;height:34px;border:1px solid #29476e;border-radius:9px;background:#071525;color:#9ab0d2;cursor:pointer;font-size:18px}
.archive-list{padding:14px;overflow:auto;max-height:calc(90vh - 62px)}
.archive-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;border:1px solid #1d385b;border-radius:11px;background:#091727;padding:13px 14px;margin-bottom:9px}
.archive-title{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.archive-date{margin-top:5px;color:#7d96ba;font-size:11px}
.archive-actions{display:flex;gap:6px}
.archive-actions button{height:32px;border:1px solid #29476e;border-radius:8px;background:#071525;color:#8fa8cc;padding:0 9px;cursor:pointer;font-size:11px}
.archive-actions .read{color:#67a9ff;border-color:#28558a}.archive-actions .restore{color:#35dca9;border-color:#236b59}
.archive-actions .forever{color:#ff5576;border-color:#6d2940}
.archive-empty{padding:35px 15px;text-align:center;color:#6f88ad;font-size:13px}
.empty{padding:30px;color:#6f88ad;text-align:center}

.reminder-mode{margin-top:14px}
.reminder-mode>label{display:block;font-size:10px;letter-spacing:1px;text-transform:uppercase;margin-bottom:7px;opacity:.7}
.mode-switch{display:flex;gap:7px}
.mode-btn{flex:1;height:36px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.03);color:#aeb8d0;border-radius:8px;font:600 11px inherit;cursor:pointer}
.mode-btn.active{border-color:#4d7cff;background:rgba(77,124,255,.12);color:#dce6ff}

@media(min-width:601px){
  .mobile-actions{grid-template-columns:minmax(0,1fr) 46px;}
  .mobile-actions .search-toggle{display:none;}
}
@media(max-width:900px){
  .topbar{padding:0 16px}.app{grid-template-columns:1fr}
  .sidebar,.editor{height:auto;min-height:0}.notes{height:auto;max-height:360px}.editor{min-height:650px}
}
@media(max-width:600px){
  .topbar{height:48px;grid-template-columns:auto minmax(0,1fr) auto;gap:5px;padding:0 8px}
  .logo{font-size:10px;letter-spacing:1.2px;text-align:center;white-space:nowrap;min-width:0}
  .back{font-size:9px;white-space:nowrap}.clock{display:block;justify-self:end;font-size:8px;white-space:nowrap;color:#8fa8d0;min-width:max-content}
  .app{width:94%;padding-top:6px;gap:10px}
  .sidebar{padding:12px;border-radius:14px}

  .mobile-actions{display:grid;grid-template-columns:minmax(0,1fr) 42px 42px;gap:7px;align-items:center}
  .mobile-actions .new-btn{height:46px;font-size:15px;margin:0}
  .mobile-actions .new-btn span{font-size:22px;margin-right:8px}
  .mobile-actions .search-toggle,.mobile-actions .archive-btn{width:42px;height:42px;margin:0;padding:0;border:1px solid #29476e;border-radius:10px;background:#071525;color:#9ab1d4;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .mobile-actions .search-toggle{font-size:22px}
  .mobile-actions .archive-btn{font-size:18px}
  .mobile-actions .archive-btn span{display:none}
  .search{display:none;margin:8px 0 0;height:42px}
  .search.mobile-search-open{display:flex}
  .search-icon{font-size:21px;margin-right:9px}
  .search input{font-size:14px}
  .archive-btn{height:38px;font-size:11px}.notes{margin-top:12px;max-height:260px}
  .note{padding:13px 14px 12px 25px;margin-bottom:8px}
  .note-title{font-size:15px}
  .pin{right:12px;top:12px;font-size:14px}
  .editor{padding:10px;min-height:520px;border-radius:14px}
  .title-input{height:50px;font-size:18px;padding:0 13px}
  .toolbar{display:grid;grid-template-columns:minmax(0,1fr) 38px 38px 38px;gap:7px;margin:12px 0;align-items:center}
  .date-box{width:auto;height:38px;min-width:0;padding:0 9px;font-size:11px;white-space:nowrap;overflow:hidden}
  .date-box span{overflow:hidden;text-overflow:ellipsis}
  .spacer{display:none}
  .tool-btn{height:38px}
  .icon-btn{width:38px;font-size:15px}
  .editor-body{height:calc(100vh - 170px);min-height:0;padding:12px 13px;border-radius:11px}
  .content{font-size:16px;line-height:1.5}
  .counter{font-size:11px;padding-top:9px}
  footer{gap:10px;font-size:7px;letter-spacing:1.5px;margin-top:20px;padding-bottom:15px}
  .footer-line{width:42px}
}

.footer-soikat{color:#7c8cff;}

  50%{opacity:.78;transform:scale(1.025)}
}

@keyframes brandReveal{
 from{
  opacity:0;
  transform:translateY(-8px);
  letter-spacing:.28em;
 }
 to{
  opacity:1;
  transform:translateY(0);
  letter-spacing:.18em;
 }
}
@keyframes brandShine{
 0%{background-position:0% center}
 100%{background-position:250% center}
}
@keyframes brandBreath{
 0%,100%{
  text-shadow:0 0 20px rgba(180,210,255,.05);
 }
 50%{
  text-shadow:0 0 30px rgba(180,210,255,.14);
 }
}


/* Note file attachments */
.file-add-btn{height:36px;min-width:38px;padding:0 10px;border:1px solid #29476e;border-radius:9px;background:#071525;color:#9ab1d4;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;font-size:13px}
.file-add-btn:hover{border-color:#3b8fff;color:#fff}
.attachments{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 10px}
.attachment-chip{display:flex;align-items:center;gap:8px;max-width:100%;padding:7px 9px;border:1px solid #29476e;border-radius:9px;background:#091727;color:#c8d8f0;font-size:11px}
.attachment-icon{font-size:17px;flex:none}
.attachment-name{max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.attachment-action{border:0;background:transparent;color:#75b2ff;cursor:pointer;font-size:12px}
.attachment-remove{color:#ff6682}
.editor-body.drag-over{outline:2px dashed #4a9bff;outline-offset:-6px;background:#0b1d32}
.drop-hint{display:none;position:absolute;inset:0;z-index:8;align-items:center;justify-content:center;background:rgba(4,13,26,.88);border:2px dashed #4b9cff;border-radius:12px;color:#dceaff;font-size:16px;font-weight:700;letter-spacing:1px;pointer-events:none}
.editor-body.drag-over .drop-hint{display:flex}


/* Google Keep-inspired responsive interface */
:root{--keep-yellow:#fbbc04;--keep-ink:#202124;--keep-muted:#5f6368}
body{margin:0!important;background:#fff!important;color:#202124!important;font-family:Roboto,Arial,sans-serif!important}
.topbar{display:none!important}
.keep-header{height:64px;position:sticky;top:0;z-index:80;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;gap:18px;padding:0 22px;color:#5f6368}
.keep-menu-btn,.keep-header-actions button{border:0;background:transparent;color:#5f6368;width:42px;height:42px;border-radius:50%;font-size:22px;cursor:pointer}
.keep-menu-btn:hover,.keep-header-actions button:hover{background:#f1f3f4}
.keep-brand{display:flex;align-items:center;gap:9px;min-width:190px;text-decoration:none;color:#5f6368;font-size:22px;font-weight:500}
.keep-brand-mark{font-size:25px;color:#fbbc04}
.keep-global-search{height:48px;max-width:720px;flex:1;display:flex;align-items:center;gap:12px;padding:0 15px;border-radius:9px;background:#f1f3f4}
.keep-search-symbol{font-size:26px;color:#5f6368}

<script>
const KEY="soikat_notepad_v1";
const ARCHIVE_KEY="soikat_notepad_archive_v1"; // Legacy deleted notes remain in Trash.
const KEEP_ARCHIVED_KEY="soikat_notepad_kept_archive_v1";
const ARCHIVE_DAYS=30;
let notes=[];
let archive=[];
let keptArchive=[];
let currentId=null;
let draftMode=false;
let newNoteOpen=false;
let reminderTimer=null;

function now(){
  return new Date().toLocaleString("en-GB",{
    day:"2-digit",month:"short",year:"numeric",
    hour:"2-digit",minute:"2-digit",hour12:true
  });
}
function load(){
  try{notes=JSON.parse(localStorage.getItem(KEY)||"[]")}catch{notes=[]}
  try{archive=JSON.parse(localStorage.getItem(ARCHIVE_KEY)||"[]")}catch{archive=[]}
  purgeExpiredArchive();

  // No default/demo notes on new devices.
  // Also remove only the exact built-in demo notes from older versions.
  const before=notes.length;
  notes=notes.filter(n=>{
    const title=String(n?.title||"");
    const content=String(n?.content||"");
    if(title==="BCS Preparation Plan" &&
       content==="Follow 200 Days Study Plan\nDaily 2-3 focused sessions\nWeekly revision (Friday)" &&
       n.pinned===true && !n.reminder && !n.countdownDate) return false;
    if((title==="Important Links" || title==="Monthly Goals") &&
       content==="" && n.pinned===false && !n.reminder && !n.countdownDate) return false;
    return true;
  });
  if(notes.length!==before) persist();

  currentId=notes[0]?.id||null;
  draftMode=false;
  render();
}
function persist(){localStorage.setItem(KEY,JSON.stringify(notes))}
function persistArchive(){localStorage.setItem(ARCHIVE_KEY,JSON.stringify(archive))}
function persistKeptArchive(){localStorage.setItem(KEEP_ARCHIVED_KEY,JSON.stringify(keptArchive))}
function purgeExpiredArchive(){
  const limit=Date.now()-(ARCHIVE_DAYS*24*60*60*1000);
  const before=archive.length;
  archive=archive.filter(n=>{
    const t=Number(n.deletedAt||0);
    return t>limit;
  });
  if(archive.length!==before) persistArchive();
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
let activeView="notes";
let keepListView=false;
function renderNotes(){
 const q=(document.getElementById("search")?.value||"").trim().toLowerCase();
 const box=document.getElementById("notes");
 let source=activeView==="archive"?keptArchive:activeView==="trash"?archive:notes;
 let list=source.filter(n=>(String(n.title||"")+" "+String(n.content||"")).toLowerCase().includes(q));
 if(newNoteOpen && activeView==="notes")list=list.filter(n=>n.id!==currentId);
 if(activeView==="reminders")list=list.filter(n=>!!n.reminder);
 list.sort((a,b)=>(Number(!!b.pinned)-Number(!!a.pinned))||((b.updated||"").localeCompare(a.updated||"")));
 if(!list.length){
   if(activeView==="archive"){
     box.innerHTML='<div class="keep-empty keep-archive-empty"><svg viewBox="0 0 120 120" aria-hidden="true"><path d="M15 32h90v13H15zM22 45v58h76V45M15 32l10-15h70l10 15M43 68l17 17 17-17M60 85V57"/></svg><div>Your archived notes appear here</div></div>';
   }else if(activeView==="trash"){
     box.innerHTML='<div class="keep-empty keep-trash-empty"><svg viewBox="0 0 120 120" aria-hidden="true"><path d="M25 30h70M42 20h36M34 30l4 73h44l4-73M49 44v43M71 44v43"/></svg><div>No notes in Trash</div></div>';
   }else{
     const msg=activeView==="reminders"?"No reminders":"Notes you add appear here";
     box.innerHTML='<div class="keep-empty"><span>💡</span><div>'+msg+'</div></div>';
   }
   return;
 }
 box.innerHTML=list.map(n=>activeView==="trash"?`
 <article class="note keep-card keep-trash-card" style="--note-bg:#202124" data-trash-card="${String(n.id)}" onclick="readArchivedNote('${String(n.id)}')">
   ${n.title?`<div class="note-title">${escapeHtml(n.title)}</div>`:""}<div class="keep-card-content">${escapeHtml(n.content||"")}</div>
   <div class="keep-card-bottom"><span>Deleted ${escapeHtml(formatArchiveDate(n.deletedAt))} · ${daysLeft(n.deletedAt)} day${daysLeft(n.deletedAt)===1?"":"s"} left</span></div>
   <div class="keep-trash-card-actions"><button type="button" data-trash-action="restore" data-id="${String(n.id)}">Restore</button><button type="button" data-trash-action="forever" data-id="${String(n.id)}">Delete forever</button></div>
 </article>`:`<article class="note keep-card ${n.id===currentId?"active":""}" style="--note-bg:${escapeHtml(n.color||"#ffffff")}" onclick="selectNote('${String(n.id).replace(/'/g,"\\\\'")}')">
 <div class="keep-card-actions">${n.pinned?'<span title="Pinned">📌</span>':""}${n.reminder?'<span title="Reminder">🔔</span>':""}</div>
 ${n.title?`<div class="note-title">${escapeHtml(n.title)}</div>`:""}<div class="keep-card-content">${escapeHtml(n.content||"")}</div>
 <div class="keep-card-bottom"><span class="keep-card-pin">⋮</span></div></article>`).join("");
 box.classList.toggle("list-view",keepListView);
}
function setKeepActive(id){["navNotes","navReminders","navArchive","navTrash"].forEach(x=>document.getElementById(x)?.classList.toggle("active",x===id));document.getElementById("keepLayout")?.classList.remove("sidebar-open");}
function showNotesView(){activeView="notes";document.getElementById("viewTitle").textContent="Notes";setKeepActive("navNotes");renderNotes();}
function showRemindersView(){activeView="reminders";document.getElementById("viewTitle").textContent="Reminders";setKeepActive("navReminders");renderNotes();}
function showArchiveView(){activeView="archive";document.getElementById("viewTitle").textContent="Archive";setKeepActive("navArchive");renderNotes();}
function showTrashView(){activeView="trash";currentId=null;draftMode=false;document.getElementById("viewTitle").textContent="Trash";setKeepActive("navTrash");render();}
function toggleKeepSidebar(){
 const layout=document.getElementById("keepLayout");
 if(window.matchMedia("(max-width:640px)").matches){layout.classList.toggle("sidebar-open");return;}
 const open=layout.classList.toggle("sidebar-collapsed")===false;
 try{localStorage.setItem("soikat_notepad_sidebar_open",open?"1":"0");}catch(e){}
}
function applySavedSidebarState(){
 const layout=document.getElementById("keepLayout");
 if(!window.matchMedia("(max-width:640px)").matches){
  let open=true;try{open=localStorage.getItem("soikat_notepad_sidebar_open")!=="0";}catch(e){}
  layout.classList.toggle("sidebar-collapsed",!open);
 }
}
function goBack(){if(document.getElementById("editorPanel").classList.contains("mobile-open")){closeMobileEditor();return;}if(document.getElementById("keepLayout").classList.contains("sidebar-open")){document.getElementById("keepLayout").classList.remove("sidebar-open");return;}if(history.length>1)history.back();}
function refreshKeepNotes(){
 const btn=document.querySelector(".keep-header-actions button[aria-label='Refresh']");
 if(btn){btn.classList.remove("refreshing");void btn.offsetWidth;btn.classList.add("refreshing");}
 try{load();}catch(e){}
 render();
 setTimeout(()=>btn?.classList.remove("refreshing"),650);
}
function toggleKeepView(){keepListView=!keepListView;document.getElementById("viewToggle").classList.toggle("active",keepListView);renderNotes();}
function clearKeepSearch(){document.getElementById("search").value="";renderNotes();}
function selectNote(id){
  const found=notes.some(n=>String(n.id)===String(id)) ||
              keptArchive.some(n=>String(n.id)===String(id)) ||
              archive.some(n=>String(n.id)===String(id));
  if(!found)return;
  draftMode=false;
  newNoteOpen=false;
  currentId=id;
  const panel=document.getElementById("editorPanel");
  panel.classList.remove("new-note-inline");
  panel.classList.add("keep-existing-open","mobile-open");
  render();
  panel.classList.add("keep-existing-open","mobile-open");
  const note=current();
  const editedEl=document.getElementById("editorEditedLabel");
  if(editedEl)editedEl.textContent=note?.updated ? editedDateLabel(note.updated) : "";
}

function current(){return notes.find(n=>n.id===currentId)||keptArchive.find(n=>n.id===currentId)||archive.find(n=>n.id===currentId)}
function render(){
  renderNotes();
  const n=current();
  if(!n){
    document.getElementById("title").value="";
    document.getElementById("content").value="";
    autoGrowNote();
    document.getElementById("date").textContent=now();
    document.getElementById("count").textContent="0";
    updateLastEditedDisplay(null);
    const editedEl=document.getElementById("editorEditedLabel");
    if(editedEl)editedEl.textContent="";
    document.getElementById("pinIcon").textContent="📌";
    document.getElementById("pinBtn").classList.remove("pinned");
    document.getElementById("reminderBtn").classList.remove("active");
  
    document.getElementById("reminderDisplay").style.display="none";
    return;
  }
  document.getElementById("title").value=n.title||"";
  document.getElementById("content").value=n.content||"";
  autoGrowNote();
  document.getElementById("date").textContent=n.updated||now();
  document.getElementById("count").textContent=(n.content||"").length;
  updateLastEditedDisplay(n);
  const editedEl=document.getElementById("editorEditedLabel");
  if(editedEl)editedEl.textContent=(n.updated && !draftMode) ? editedDateLabel(n.updated) : "";
  document.getElementById("pinIcon").textContent="📌";
  document.getElementById("pinBtn").classList.toggle("pinned",!!n.pinned);
  document.getElementById("reminderBtn").classList.toggle("active",!!n.reminder);

  updateReminderDisplay(n);
}

function updateLastEditedDisplay(n){
  const el=document.getElementById("lastEdited");
  if(!el)return;
  el.textContent=(n && n.updated) ? n.updated : "—";
}

function saveCurrent(){
  const title=document.getElementById("title").value;
  const content=document.getElementById("content").value;
  const hasText=title.trim()!=="" || content.trim()!=="";

  // A completely blank new note is only a draft and is never saved.
  if(draftMode && !hasText){
    document.getElementById("count").textContent=content.length;
    updateLastEditedDisplay(null);
    return;
  }

  let n=current();

  // Create the note only when the user actually writes something.
  if(!n && hasText){
    n={
      id:crypto.randomUUID(),
      title:title.trim() || "Untitled Note",
      content:content,
      updated:now(),
      pinned:false,
      reminder:null,
      countdownDate:null
    };
    notes.unshift(n);
    currentId=n.id;
    draftMode=false;
  }

  if(!n)return;

  n.title=title.trim() || "Untitled Note";
  n.content=content;
  n.updated=now();
  if(keptArchive.some(x=>x.id===n.id))persistKeptArchive();else persist();

  document.getElementById("count").textContent=n.content.length;
  updateLastEditedDisplay(n);
  renderNotes();
}
function newNote(){
  draftMode=true;
  newNoteOpen=true;
  currentId=null;
  const panel=document.getElementById("editorPanel");
  panel.classList.remove("keep-existing-open");
  panel.classList.add("new-note-inline","mobile-open");
  document.getElementById("title").value="";
  const bodyEl=document.getElementById("content");
  bodyEl.value="";
  bodyEl.readOnly=false;
  bodyEl.disabled=false;
  bodyEl.removeAttribute("readonly");
  bodyEl.removeAttribute("disabled");
  document.getElementById("count").textContent="0";
  updateLastEditedDisplay(null);
  document.getElementById("pinIcon").textContent="📌";
  document.getElementById("pinBtn").classList.remove("pinned");
  document.getElementById("reminderBtn").classList.remove("active");
  document.getElementById("reminderDisplay").style.display="none";
  renderNotes();

  // Focus the body immediately in the click gesture, then re-focus after layout.
  const focusBody=()=>{
    const el=document.getElementById("content");
    if(!el || !panel.isConnected)return;
    if(el.disabled || el.readOnly)return;
    el.focus({preventScroll:true});
    try{el.setSelectionRange(el.value.length,el.value.length);}catch(_){}
  };
  focusBody();
  requestAnimationFrame(()=>{focusBody();requestAnimationFrame(focusBody);});
  setTimeout(focusBody,60);
  setTimeout(focusBody,180);
}
function deleteCurrent(){
  const n=current();

  // Blank unsaved draft: nothing to archive.
  if(draftMode || !n){
    draftMode=false;
    currentId=notes[0]?.id||null;
    render();
    return;
  }

  // Move deleted note to Trash, separate from Archive.
  archive.unshift({...n,deletedAt:Date.now()});

  notes=notes.filter(x=>x.id!==n.id);
  keptArchive=keptArchive.filter(x=>x.id!==n.id);
  persist();
  persistKeptArchive();
  persistArchive();

  currentId=notes[0]?.id||null;
  draftMode=false;
  render();
}

function archiveCurrentNote(){
  const n=notes.find(x=>x.id===currentId);
  if(!n)return;
  keptArchive.unshift({...n,archivedAt:Date.now()});
  notes=notes.filter(x=>x.id!==n.id);
  persist();persistKeptArchive();
  currentId=notes[0]?.id||null;draftMode=false;render();
}
function unarchiveCurrentNote(){
  const n=keptArchive.find(x=>x.id===currentId);
  if(!n)return;
  notes.unshift({...n,updated:now()});
  keptArchive=keptArchive.filter(x=>x.id!==n.id);
  persist();persistKeptArchive();
  currentId=n.id;draftMode=false;activeView="notes";
  document.getElementById("viewTitle").textContent="Notes";
  setKeepActive("navNotes");render();
}
function togglePin(){
  let n=current();
  if(!n){
    const title=document.getElementById("title").value.trim();
    const content=document.getElementById("content").value;
    if(!title && !content.trim()) return;
    n={id:crypto.randomUUID(),title:title||"Untitled Note",content,updated:now(),pinned:false,reminder:null,countdownDate:null};
    notes.unshift(n);
    currentId=n.id;
    draftMode=false;
  }
  n.pinned=!n.pinned;
  n.updated=now();
  if(keptArchive.some(x=>x.id===n.id))persistKeptArchive();else persist();
  render();
}
function formatArchiveDate(timestamp){
  return new Date(timestamp).toLocaleString("en-GB",{
    day:"2-digit",month:"short",year:"numeric",
    hour:"2-digit",minute:"2-digit",hour12:true
  });
}
function daysLeft(deletedAt){
  const left=Math.ceil((deletedAt + ARCHIVE_DAYS*24*60*60*1000 - Date.now())/(24*60*60*1000));
  return Math.max(0,left);
}
function openArchive(){
  purgeExpiredArchive();
  document.querySelector("#archiveModal .archive-head strong").textContent="TRASH";
  renderArchive();
  document.getElementById("archiveModal").classList.add("show");
}
function closeArchive(event){
  if(event && event.target!==document.getElementById("archiveModal")) return;
  document.getElementById("archiveModal").classList.remove("show");
}
function renderArchive(){
  const box=document.getElementById("archiveList");
  if(!archive.length){
    box.innerHTML='<div class="archive-empty keep-trash-empty"><svg viewBox="0 0 120 120" aria-hidden="true"><path d="M25 30h70M42 20h36M34 30l4 73h44l4-73M49 44v43M71 44v43"/></svg><div>No notes in Trash</div></div>';
    return;
  }
  box.innerHTML=archive.map(n=>`
    <div class="archive-item">
      <div>

function countdownText(target){
  if(!target)return "";
  const end=new Date(target);
  const diff=end.getTime()-Date.now();
  if(diff<=0){
    const abs=Math.abs(diff);
    const days=Math.floor(abs/86400000);
    const hours=Math.floor((abs%86400000)/3600000);
    const minutes=Math.floor((abs%3600000)/60000);
    if(days) return days+"d overdue";
    if(hours) return hours+"h overdue";
    return minutes+"m overdue";
  }
  const days=Math.floor(diff/86400000);
  const hours=Math.floor((diff%86400000)/3600000);
  const minutes=Math.floor((diff%3600000)/60000);
  if(days>0)return days+"d "+hours+"h";
  if(hours>0)return hours+"h "+minutes+"m";
  return minutes+"m";
}

function countdownLongText(target){
  if(!target)return "";
  const end=new Date(target);
  const diff=end.getTime()-Date.now();
  const abs=Math.abs(diff);
  const days=Math.floor(abs/86400000);
  const hours=Math.floor((abs%86400000)/3600000);
  const minutes=Math.floor((abs%3600000)/60000);
  const seconds=Math.floor((abs%60000)/1000);
  const d=days+" day"+(days===1?"":"s");
  const h=hours+" hour"+(hours===1?"":"s");
  const m=minutes+" minute"+(minutes===1?"":"s");
  const s=seconds+" second"+(seconds===1?"":"s");
  return diff>0 ? d+", "+h+", "+m+", "+s : d+", "+h+", "+m+", "+s+" overdue";
}


function insertChecklistItem(){
  const el=document.getElementById("content");
  const start=el.selectionStart;
  const end=el.selectionEnd;
  const before=el.value.slice(0,start);
  const selected=el.value.slice(start,end);

  // If the cursor is on a line, toggle/add a checkbox prefix.
  const lineStart=before.lastIndexOf("\n")+1;
  const lineEnd=el.value.indexOf("\n",start);
  const actualEnd=lineEnd===-1?el.value.length:lineEnd;
  const line=el.value.slice(lineStart,actualEnd);

  if(/^\s*☐\s?/.test(line)){
    const updatedLine=line.replace(/^(\s*)☐\s?/,"$1");
    el.value=el.value.slice(0,lineStart)+updatedLine+el.value.slice(actualEnd);
    el.selectionStart=el.selectionEnd=lineStart+updatedLine.length;
  }else if(/^\s*☑\s?/.test(line)){
    const updatedLine=line.replace(/^(\s*)☑\s?/,"$1");
    el.value=el.value.slice(0,lineStart)+updatedLine+el.value.slice(actualEnd);
    el.selectionStart=el.selectionEnd=lineStart+updatedLine.length;
  }else{
    const replacement="☐ "+selected;
    el.setRangeText(replacement,start,end,"end");
  }

  saveCurrent();
  el.focus();
}

function handleEditorEnter(e){
  if(e.key!=="Enter" || e.isComposing) return;

  const el=e.target;
  const pos=el.selectionStart;
  if(pos!==el.selectionEnd) return;

  const before=el.value.slice(0,pos);
  const after=el.value.slice(pos);

  // Current line, without the newline before it.
  const lineStart=before.lastIndexOf("\n")+1;
  const line=before.slice(lineStart);

  // If the previous Enter already created an empty marker,
  // a second Enter exits the list and removes that marker.
  const emptyMarker=/^([ \t]*)(☐|☑|[-*+#•▪▫◦→»›>])\s*$/;
  const emptyNumber=/^([ \t]*)(\d+)([.]|।)\s*$/;
  const emptyBangla=/^([ \t]*)([০-৯]+)([.]|।)\s*$/;

  if(emptyMarker.test(line) || emptyNumber.test(line) || emptyBangla.test(line)){
    e.preventDefault();
    e.stopImmediatePropagation();

    const value=el.value;
    el.value=value.slice(0,lineStart)+"\n"+after;
    el.selectionStart=el.selectionEnd=lineStart+1;
    el.dispatchEvent(new Event("input",{bubbles:true}));
    return;
  }

  let insert="";

  // Checklist: ☐ Task -> Enter -> ☐
  let m=line.match(/^([ \t]*)(☐|☑)\s+(.+)$/);
  if(m){
    insert="\n"+m[1]+"☐ ";
  }

  // English numbering: 1. -> 2. (or 1। -> 2।)
  if(!insert){
    m=line.match(/^([ \t]*)(\d+)([.]|।)\s+(.+)$/);
    if(m){
      insert="\n"+m[1]+(Number(m[2])+1)+m[3]+" ";
    }
  }

  // Bangla numbering: ১। -> ২।
  if(!insert){
    m=line.match(/^([ \t]*)([০-৯]+)([.]|।)\s+(.+)$/);
    if(m){
      const bd="০১২৩৪৫৬৭৮৯";
      const n=Number(m[2].split("").map(ch=>bd.indexOf(ch)).join(""));
      const next=String(n+1).split("").map(ch=>bd[Number(ch)]).join("");
      insert="\n"+m[1]+next+m[3]+" ";
    }
  }

  // Common bullets: preserve exactly the bullet the user typed.
  if(!insert){
    m=line.match(/^([ \t]*)([-*+#•▪▫◦→»›>])\s+(.+)$/);
    if(m){
      insert="\n"+m[1]+m[2]+" ";
    }
  }

  if(!insert) return;

  e.preventDefault();
  e.stopImmediatePropagation();

  el.value=before+insert+after;
  const newPos=before.length+insert.length;
  el.selectionStart=el.selectionEnd=newPos;
  el.dispatchEvent(new Event("input",{bubbles:true}));
}

        try{new Notification(n.title||"Soikat Notepad",{body:"Reminder: this note is due now."});}catch{}

// File attachments are stored in IndexedDB (not localStorage) and linked to each note.
const ATTACH_DB_NAME = "soikat_notepad_attachments_v1";
const ATTACH_STORE = "files";
let attachDbPromise = null;

function openAttachDb(){
  if(attachDbPromise) return attachDbPromise;
  attachDbPromise = new Promise((resolve,reject)=>{
    const req=indexedDB.open(ATTACH_DB_NAME,1);
    req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains(ATTACH_STORE))db.createObjectStore(ATTACH_STORE,{keyPath:"id"});};
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
  });
  return attachDbPromise;
}
async function attachmentTx(mode, action){
  const db=await openAttachDb();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(ATTACH_STORE,mode);
    const store=tx.objectStore(ATTACH_STORE);
    let req;
    try{req=action(store);}catch(e){reject(e);return;}
    if(req){req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);}
    else{tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error);}
  });
}
function fileIcon(name){
  const ext=(name.split(".").pop()||"").toLowerCase();
  if(["html","htm"].includes(ext))return "🌐";
  if(["doc","docx","rtf"].includes(ext))return "📝";
  if(["xls","xlsx","csv","ods"].includes(ext))return "📊";
  if(ext==="pdf")return "📕";
  return "📄";
}
async function renderAttachments(){
  const wrap=document.getElementById("noteAttachments");
  if(!wrap)return;
  wrap.innerHTML="";
  const n=current();
  if(!n || !n.id)return;
  let items=[];
  try{items=await attachmentTx("readonly",s=>s.getAll());}catch(e){console.warn("Attachment storage unavailable",e);return;}
  items.filter(f=>f.noteId===n.id).forEach(f=>{
    const chip=document.createElement("div");chip.className="attachment-chip";
    const icon=document.createElement("span");icon.className="attachment-icon";icon.textContent=fileIcon(f.name);
    const name=document.createElement("span");name.className="attachment-name";name.textContent=f.name;name.title=f.name;
    const download=document.createElement("button");download.className="attachment-action";download.type="button";download.textContent="Open";
    download.addEventListener("click",()=>{const url=URL.createObjectURL(f.blob);const a=document.createElement("a");a.href=url;a.download=f.name;a.target="_blank";a.rel="noopener";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);});
    const remove=document.createElement("button");remove.className="attachment-action attachment-remove";remove.type="button";remove.textContent="×";remove.title="Remove file";
    remove.addEventListener("click",async()=>{await attachmentTx("readwrite",s=>s.delete(f.id));renderAttachments();});
    chip.append(icon,name,download,remove);wrap.appendChild(chip);
  });
}
async function addNoteFiles(fileList){
  const n=current();
  if(!n || !n.id){alert("Create or select a note before attaching files.");return;}
  const files=Array.from(fileList||[]);
  if(!files.length)return;
  const allowed=/\.(html?|docx?|xlsx?|csv|ods|pdf|txt|rtf)$/i;
  const valid=files.filter(f=>allowed.test(f.name));
  const invalid=files.filter(f=>!allowed.test(f.name));
  if(invalid.length)alert("Unsupported file(s) skipped: "+invalid.map(f=>f.name).join(", "));
  for(const f of valid){
    const id=(crypto.randomUUID?crypto.randomUUID():Date.now()+"_"+Math.random().toString(36).slice(2));
    await attachmentTx("readwrite",s=>s.put({id,noteId:n.id,name:f.name,type:f.type,size:f.size,blob:f,addedAt:Date.now()}));
  }
  await renderAttachments();
}

    } else if(content && take && board && editor && editor.nextElementSibling!==board){
      content.insertBefore(editor,board);
    }
  };
  if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",placeComposer,{once:true});
  else placeComposer();
})();
</script>
